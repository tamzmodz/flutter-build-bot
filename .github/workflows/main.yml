name: Web to APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL Website"
        required: true
        type: string
        default: "http://tamzdev.falixsrv.me:24465"

      app_name:
        description: "Nama Aplikasi"
        required: true
        type: string
        default: "TamzDev"

      package_name:
        description: "Package Name"
        required: true
        type: string
        default: "com.tamzdev.webapk"


jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK SETUP"
          echo "=========================================="

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK tidak ditemukan."
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""

          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager \
              -type f \
              2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          echo ""
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          echo ""
          echo "Installing Android packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "ANDROID SDK READY"


      # ==========================================
      # GRADLE 8.9
      # ==========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # ==========================================
      # VALIDATE INPUT
      # ==========================================

      - name: Validate Inputs
        shell: bash
        env:
          WEB_URL: ${{ inputs.url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}

        run: |
          set -e

          echo "=========================================="
          echo "VALIDATING INPUT"
          echo "=========================================="

          echo "URL     : $WEB_URL"
          echo "APP     : $APP_NAME"
          echo "PACKAGE : $PACKAGE_NAME"

          if [ -z "$WEB_URL" ]; then
            echo "ERROR: URL kosong."
            exit 1
          fi

          if [ -z "$APP_NAME" ]; then
            echo "ERROR: App name kosong."
            exit 1
          fi

          if [ -z "$PACKAGE_NAME" ]; then
            echo "ERROR: Package name kosong."
            exit 1
          fi

          if [[ ! "$WEB_URL" =~ ^https?:// ]]; then
            echo "ERROR: URL harus diawali http:// atau https://"
            exit 1
          fi

          if [[ ! "$PACKAGE_NAME" =~ ^[a-zA-Z_][a-zA-Z0-9_]*(\.[a-zA-Z_][a-zA-Z0-9_]*)+$ ]]; then
            echo "ERROR: Package name tidak valid."
            echo "Contoh: com.tamzdev.webapk"
            exit 1
          fi

          echo ""
          echo "INPUT VALID."


      # ==========================================
      # CREATE PROJECT
      # ==========================================

      - name: Create Android Project
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          WEB_URL: ${{ inputs.url }}

        run: |
          set -e

          echo "=========================================="
          echo "CREATING ANDROID PROJECT"
          echo "=========================================="

          mkdir -p app/src/main/java/com/tamzdev/webapk
          mkdir -p app/src/main/res/values


          # ========================================
          # GRADLE PROPERTIES
          # ========================================

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          org.gradle.parallel=true
          org.gradle.caching=true
          EOF


          # ========================================
          # SETTINGS
          # ========================================

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WebToAPK"

          include(":app")
          EOF


          # ========================================
          # ROOT BUILD.GRADLE
          # ========================================

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }

          allprojects {

              configurations.configureEach {

                  resolutionStrategy {

                      force(
                          "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                      )

                      force(
                          "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
                      )

                      force(
                          "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
                      )
                  }
              }
          }
          EOF


          # ========================================
          # APP BUILD.GRADLE
          # ========================================

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }


          def webUrl =
              project.findProperty("WEB_URL")
              ?: "https://example.com"


          def appName =
              project.findProperty("APP_NAME")
              ?: "Web APK"


          def packageName =
              project.findProperty("PACKAGE_NAME")
              ?: "com.tamzdev.webapk"


          webUrl = webUrl
              .replace("\\", "\\\\")
              .replace("\"", "\\\"")


          appName = appName
              .replace("\\", "\\\\")
              .replace("\"", "\\\"")


          android {

              namespace "com.tamzdev.webapk"

              compileSdk 35


              defaultConfig {

                  applicationId packageName

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName "1.0"
              }


              buildFeatures {

                  buildConfig true
              }


              buildTypes {

                  debug {

                      buildConfigField(
                          "String",
                          "WEB_URL",
                          "\"${webUrl}\""
                      )

                      resValue(
                          "string",
                          "app_name",
                          "\"${appName}\""
                      )
                  }


                  release {

                      minifyEnabled false

                      shrinkResources false

                      buildConfigField(
                          "String",
                          "WEB_URL",
                          "\"${webUrl}\""
                      )

                      resValue(
                          "string",
                          "app_name",
                          "\"${appName}\""
                      )
                  }
              }
          }


          dependencies {

              implementation(
                  "androidx.appcompat:appcompat:1.7.0"
              )

              implementation(
                  "androidx.webkit:webkit:1.12.1"
              )
          }
          EOF


          # ========================================
          # MANIFEST
          # ========================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          # ========================================
          # STYLE
          # ========================================

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:colorAccent">
                      #7C3AED
                  </item>

                  <item name="android:statusBarColor">
                      #000000
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

              </style>

          </resources>
          EOF


          # ========================================
          # MAIN ACTIVITY
          # ========================================

          cat > app/src/main/java/com/tamzdev/webapk/MainActivity.java <<'EOF'
          package com.tamzdev.webapk;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(
                  Bundle savedInstanceState
              ) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings =
                      webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setJavaScriptCanOpenWindowsAutomatically(
                      true
                  );

                  settings.setSupportMultipleWindows(
                      true
                  );

                  settings.setMediaPlaybackRequiresUserGesture(
                      false
                  );

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);


                  webView.setWebChromeClient(
                      new WebChromeClient()
                  );


                  webView.setWebViewClient(
                      new WebViewClient() {

                          @Override
                          public boolean
                          shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                          ) {

                              view.loadUrl(
                                  request
                                      .getUrl()
                                      .toString()
                              );

                              return true;
                          }
                      }
                  );


                  setContentView(webView);


                  webView.loadUrl(
                      BuildConfig.WEB_URL
                  );
              }


              @Override
              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }
              }


              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.stopLoading();

                      webView.destroy();

                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF


          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT CREATED"
          echo "=========================================="


      # ==========================================
      # VERIFY PROJECT
      # ==========================================

      - name: Verify Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING PROJECT"
          echo "=========================================="

          test -f gradle.properties
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/values/styles.xml
          test -f app/src/main/java/com/tamzdev/webapk/MainActivity.java

          echo "Project verification OK."


      # ==========================================
      # SHOW DEPENDENCIES
      # ==========================================

      - name: Check Dependencies
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING DEPENDENCIES"
          echo "=========================================="

          gradle \
            --no-daemon \
            dependencies \
            --configuration debugRuntimeClasspath


      # ==========================================
      # BUILD DEBUG APK
      # ==========================================

      - name: Build Debug APK
        shell: bash
        env:
          WEB_URL: ${{ inputs.url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          APP_NAME: ${{ inputs.app_name }}

        run: |
          set -o pipefail

          echo "=========================================="
          echo "BUILDING DEBUG APK"
          echo "=========================================="

          echo "URL     : $WEB_URL"
          echo "APP     : $APP_NAME"
          echo "PACKAGE : $PACKAGE_NAME"

          echo ""

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            -PWEB_URL="$WEB_URL" \
            -PPACKAGE_NAME="$PACKAGE_NAME" \
            -PAPP_NAME="$APP_NAME" \
            :app:assembleDebug

          echo ""
          echo "=========================================="
          echo "APK BUILD SUCCESS"
          echo "=========================================="


      # ==========================================
      # CHECK APK
      # ==========================================

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERROR: APK tidak ditemukan."

            find app/build \
              -type f \
              2>/dev/null \
              | sort || true

            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh "$APK"

          file "$APK"


      # ==========================================
      # PREPARE APK
      # ==========================================

      - name: Prepare APK
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}

        run: |
          set -e

          mkdir -p output

          SAFE_APP_NAME="$APP_NAME"

          SAFE_APP_NAME="${SAFE_APP_NAME//\//-}"

          SAFE_APP_NAME="${SAFE_APP_NAME//\\/ -}"

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "output/${SAFE_APP_NAME}-debug.apk"

          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh output/


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web-to-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30


      # ==========================================
      # COMPLETE
      # ==========================================

      - name: Build Complete
        run: |
          echo ""
          echo "=========================================="
          echo "          BUILD BERHASIL"
          echo "=========================================="
          echo ""
          echo "APK tersedia di Artifacts."
          echo ""
          echo "=========================================="
