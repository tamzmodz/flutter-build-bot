name: Web to APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL Website"
        required: true
        type: string
        default: "http://tamzdev.falixsrv.me:24465"

      app_name:
        description: "Nama Aplikasi"
        required: true
        type: string
        default: "TamzDev"

      package_name:
        description: "Package Name"
        required: true
        type: string
        default: "com.tamzdev.webapk"

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # CHECKOUT
      # =========================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================
      # JAVA 17
      # =========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================
      # ANDROID SDK
      # =========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0


      # =========================================
      # GRADLE
      # =========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # =========================================
      # CREATE ANDROID PROJECT
      # =========================================

      - name: Create Android Project
        shell: bash

        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          WEB_URL: ${{ inputs.url }}

        run: |

          set -e

          echo "=========================================="
          echo "       WEB TO APK BUILDER"
          echo "=========================================="
          echo "App Name     : $APP_NAME"
          echo "Package Name : $PACKAGE_NAME"
          echo "Website      : $WEB_URL"
          echo "=========================================="


          # ---------------------------------------
          # DIRECTORIES
          # ---------------------------------------

          mkdir -p app/src/main/java/com/tamzdev/webapk
          mkdir -p app/src/main/res/values


          # ---------------------------------------
          # GRADLE PROPERTIES
          # ---------------------------------------

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF


          # ---------------------------------------
          # SETTINGS
          # ---------------------------------------

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WebToAPK"

          include(":app")
          EOF


          # ---------------------------------------
          # ROOT BUILD.GRADLE
          # ---------------------------------------

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


          # ---------------------------------------
          # APP BUILD.GRADLE
          # ---------------------------------------

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }


          def webUrl =
              project.findProperty("WEB_URL")
              ?: "https://example.com"


          def appName =
              project.findProperty("APP_NAME")
              ?: "Web APK"


          def packageName =
              project.findProperty("PACKAGE_NAME")
              ?: "com.tamzdev.webapk"


          /*
           * Escape values so special characters
           * cannot break generated Gradle code.
           */

          webUrl = webUrl
              .replace("\\", "\\\\")
              .replace("\"", "\\\"")


          appName = appName
              .replace("\\", "\\\\")
              .replace("\"", "\\\"")


          android {

              namespace "com.tamzdev.webapk"

              compileSdk 35


              defaultConfig {

                  applicationId packageName

                  minSdk 23

                  targetSdk 35

                  versionCode 1

                  versionName "1.0"
              }


              buildFeatures {

                  buildConfig true
              }


              buildTypes {

                  debug {

                      buildConfigField(
                          "String",
                          "WEB_URL",
                          "\"${webUrl}\""
                      )

                      resValue(
                          "string",
                          "app_name",
                          "\"${appName}\""
                      )
                  }


                  release {

                      minifyEnabled false

                      shrinkResources false

                      buildConfigField(
                          "String",
                          "WEB_URL",
                          "\"${webUrl}\""
                      )

                      resValue(
                          "string",
                          "app_name",
                          "\"${appName}\""
                      )
                  }
              }
          }


          dependencies {

              implementation(
                  "androidx.appcompat:appcompat:1.7.0"
              )

              implementation(
                  "androidx.webkit:webkit:1.12.1"
              )
          }
          EOF


          # ---------------------------------------
          # ANDROID MANIFEST
          # ---------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">


              <uses-permission
                  android:name="android.permission.INTERNET" />


              <application

                  android:allowBackup="true"

                  android:supportsRtl="true"

                  android:usesCleartextTraffic="true"

                  android:label="@string/app_name"

                  android:theme="@style/AppTheme">


                  <activity

                      android:name=".MainActivity"

                      android:exported="true"

                      android:screenOrientation="portrait">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>


                  </activity>


              </application>

          </manifest>
          EOF


          # ---------------------------------------
          # STYLES
          # ---------------------------------------

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:windowActionModeOverlay">
                      true
                  </item>

                  <item name="android:colorAccent">
                      #7C3AED
                  </item>

                  <item name="android:statusBarColor">
                      #000000
                  </item>

                  <item name="android:navigationBarColor">
                      #000000
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:windowNoTitle">
                      true
                  </item>

              </style>

          </resources>
          EOF


          # ---------------------------------------
          # MAIN ACTIVITY
          # ---------------------------------------

          cat > app/src/main/java/com/tamzdev/webapk/MainActivity.java <<'EOF'
          package com.tamzdev.webapk;


          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;


          public class MainActivity extends Activity {


              private WebView webView;


              @SuppressLint("SetJavaScriptEnabled")

              @Override

              protected void onCreate(
                  Bundle savedInstanceState
              ) {

                  super.onCreate(savedInstanceState);


                  // ---------------------------------
                  // WEBVIEW
                  // ---------------------------------

                  webView = new WebView(this);


                  WebSettings settings =
                      webView.getSettings();


                  // JavaScript

                  settings.setJavaScriptEnabled(true);


                  // Local storage

                  settings.setDomStorageEnabled(true);


                  // Database

                  settings.setDatabaseEnabled(true);


                  // File access

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);


                  // Multiple windows

                  settings.setJavaScriptCanOpenWindowsAutomatically(
                      true
                  );

                  settings.setSupportMultipleWindows(
                      true
                  );


                  // Media

                  settings.setMediaPlaybackRequiresUserGesture(
                      false
                  );


                  // Zoom

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);


                  // ---------------------------------
                  // CHROME CLIENT
                  // ---------------------------------

                  webView.setWebChromeClient(
                      new WebChromeClient()
                  );


                  // ---------------------------------
                  // WEBVIEW CLIENT
                  // ---------------------------------

                  webView.setWebViewClient(
                      new WebViewClient() {


                          @Override

                          public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request
                          ) {

                              view.loadUrl(
                                  request
                                      .getUrl()
                                      .toString()
                              );

                              return true;
                          }


                          @Override

                          public void onReceivedError(
                              WebView view,
                              WebResourceRequest request,
                              WebResourceError error
                          ) {

                              super.onReceivedError(
                                  view,
                                  request,
                                  error
                              );
                          }

                      }
                  );


                  // ---------------------------------
                  // FULL SCREEN VIEW
                  // ---------------------------------

                  webView.setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );


                  // ---------------------------------
                  // SET CONTENT
                  // ---------------------------------

                  setContentView(webView);


                  // ---------------------------------
                  // LOAD WEBSITE
                  // ---------------------------------

                  webView.loadUrl(
                      BuildConfig.WEB_URL
                  );
              }


              // -------------------------------------
              // BACK BUTTON
              // -------------------------------------

              @Override

              public void onBackPressed() {

                  if (
                      webView != null &&
                      webView.canGoBack()
                  ) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }


              // -------------------------------------
              // CLEANUP
              // -------------------------------------

              @Override

              protected void onDestroy() {

                  if (webView != null) {

                      webView.stopLoading();

                      webView.destroy();

                      webView = null;
                  }

                  super.onDestroy();
              }

          }
          EOF


          echo ""
          echo "=========================================="
          echo "ANDROID PROJECT CREATED"
          echo "=========================================="
          echo ""


      # =========================================
      # VERIFY PROJECT
      # =========================================

      - name: Verify Android Project
        shell: bash

        run: |

          set -e

          echo "Checking generated files..."

          test -f gradle.properties
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/tamzdev/webapk/MainActivity.java

          echo ""
          echo "All project files OK."
          echo ""


      # =========================================
      # BUILD DEBUG APK
      # =========================================

      - name: Build Debug APK
        shell: bash

        env:
          WEB_URL: ${{ inputs.url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          APP_NAME: ${{ inputs.app_name }}

        run: |

          set -e

          echo "=========================================="
          echo "BUILDING APK"
          echo "=========================================="

          echo "URL     : $WEB_URL"
          echo "APP     : $APP_NAME"
          echo "PACKAGE : $PACKAGE_NAME"

          echo ""

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            -PWEB_URL="$WEB_URL" \
            -PPACKAGE_NAME="$PACKAGE_NAME" \
            -PAPP_NAME="$APP_NAME" \
            :app:assembleDebug

          echo ""

          echo "APK BUILD FINISHED."


      # =========================================
      # PREPARE APK
      # =========================================

      - name: Prepare APK
        shell: bash

        env:
          APP_NAME: ${{ inputs.app_name }}

        run: |

          set -e

          mkdir -p output


          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            "output/${APP_NAME}-debug.apk"


          echo ""
          echo "=========================================="
          echo "APK READY"
          echo "=========================================="


          ls -lh output/


      # =========================================
      # UPLOAD APK
      # =========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: web-to-apk

          path: output/*.apk

          if-no-files-found: error

          retention-days: 30


      # =========================================
      # SUCCESS
      # =========================================

      - name: Build Complete
        run: |

          echo ""
          echo "=========================================="
          echo "       WEB TO APK BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK berhasil dibuat."
          echo "Buka Artifacts untuk mengambil APK."
          echo ""
