name: Build APK & Send to Telegram

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama APK"
        required: true
        default: "MyApp"

      user_id:
        description: "Telegram User ID"
        required: true

      zip_url:
        description: "URL ZIP project"
        required: true

      build_type:
        description: "Tipe build"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:

      # =========================================
      # CHECKOUT
      # =========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================
      # DOWNLOAD PROJECT
      # =========================================

      - name: Download Project ZIP
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Downloading project"
          echo "========================================="

          rm -rf project downloaded.zip
          mkdir -p project

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            "${{ inputs.zip_url }}" \
            -o downloaded.zip

          test -s downloaded.zip

          echo ""
          echo "ZIP:"
          ls -lh downloaded.zip

          echo ""
          echo "Extracting..."

          unzip -q downloaded.zip -d project

          echo ""
          echo "Project files:"
          find project -maxdepth 3 -type f | head -100


      # =========================================
      # JAVA 17
      # =========================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # =========================================
      # ANDROID SDK
      #
      # GitHub ubuntu-24.04 runner sudah
      # menyediakan Android SDK.
      #
      # JANGAN menggunakan setup-android@v3
      # karena versi tersebut dapat meminta
      # package "tools" yang sudah obsolete.
      # =========================================

      - name: Setup Android SDK Environment
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Android SDK"
          echo "========================================="

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK directory not found:"
            echo "$SDK"
            exit 1
          fi

          echo "SDK: $SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            echo "Using:"
            echo "$SDK/cmdline-tools/latest/bin"
          elif [ -d "$SDK/cmdline-tools/16.0/bin" ]; then
            echo "Using:"
            echo "$SDK/cmdline-tools/16.0/bin"

            echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          else
            echo "ERROR: Android command line tools not found."
            find "$SDK/cmdline-tools" -maxdepth 3 -type f 2>/dev/null | head -50 || true
            exit 1
          fi


      # =========================================
      # ACCEPT LICENSES
      # =========================================

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME}"

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager \
            --sdk_root="$SDK" \
            --licenses \
            >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."


      # =========================================
      # VERIFY ANDROID SDK
      # =========================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Verify Android SDK"
          echo "========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "ADB:"
          adb version

          echo ""
          echo "SDK Manager:"
          sdkmanager --version

          echo ""
          echo "Installed Android packages:"
          sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --list_installed \
            | head -150


      # =========================================
      # DETECT PROJECT
      # =========================================

      - name: Detect Project Type
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Detecting project"
          echo "========================================="

          FLUTTER_FILE=$(find project \
            -type f \
            -name "pubspec.yaml" \
            -print \
            -quit)

          GRADLE_FILE=$(find project \
            -type f \
            -name "gradlew" \
            -print \
            -quit)

          if [ -n "$FLUTTER_FILE" ]; then

            PROJECT_ROOT=$(dirname "$FLUTTER_FILE")
            PROJECT_TYPE="flutter"

            echo ""
            echo "Detected:"
            echo "Flutter project"

          elif [ -n "$GRADLE_FILE" ]; then

            PROJECT_ROOT=$(dirname "$GRADLE_FILE")
            PROJECT_TYPE="gradle"

            echo ""
            echo "Detected:"
            echo "Native Android Gradle project"

          else

            echo ""
            echo "ERROR: Could not detect project type."
            echo ""

            echo "Project files:"
            find project -maxdepth 6 -type f | head -300

            exit 1

          fi

          echo ""
          echo "PROJECT_TYPE=$PROJECT_TYPE"
          echo "PROJECT_ROOT=$PROJECT_ROOT"

          echo "PROJECT_TYPE=$PROJECT_TYPE" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"


      # =========================================
      # SHOW PROJECT
      # =========================================

      - name: Show Project Structure
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Project structure"
          echo "========================================="

          echo ""
          echo "Root:"
          echo "$PROJECT_ROOT"

          echo ""
          echo "Files:"

          find "$PROJECT_ROOT" \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -400


      # =========================================
      # FLUTTER
      # =========================================

      - name: Setup Flutter
        if: env.PROJECT_TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # =========================================
      # FLUTTER BUILD
      # =========================================

      - name: Build Flutter APK
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Flutter build"
          echo "========================================="

          echo ""
          echo "Flutter version:"
          flutter --version

          echo ""
          echo "Cleaning..."
          flutter clean

          echo ""
          echo "Getting dependencies..."
          flutter pub get

          echo ""
          echo "Building APK..."

          if [ "${{ inputs.build_type }}" = "release" ]; then

            flutter build apk --release

          else

            flutter build apk --debug

          fi


      # =========================================
      # NATIVE GRADLE PREPARATION
      # =========================================

      - name: Prepare Native Android Project
        if: env.PROJECT_TYPE == 'gradle'
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Native Android project"
          echo "========================================="

          chmod +x gradlew

          echo ""
          echo "Gradle version:"
          ./gradlew --version

          echo ""
          echo "Gradle files:"

          find . \
            -maxdepth 4 \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            -print


      # =========================================
      # NATIVE GRADLE BUILD
      # =========================================

      - name: Build Native Android APK
        if: env.PROJECT_TYPE == 'gradle'
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Gradle APK build"
          echo "========================================="

          chmod +x gradlew

          if [ "${{ inputs.build_type }}" = "release" ]; then

            echo "Building RELEASE APK..."

            ./gradlew \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              assembleRelease

          else

            echo "Building DEBUG APK..."

            ./gradlew \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              assembleDebug

          fi


      # =========================================
      # LOCATE APK
      # =========================================

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Searching for APK"
          echo "========================================="

          APK=""

          if [ "$PROJECT_TYPE" = "flutter" ]; then

            APK=$(find "$PROJECT_ROOT" \
              -type f \
              -name "*.apk" \
              -path "*/build/app/outputs/flutter-apk/*" \
              -print \
              | head -1)

          else

            APK=$(find "$PROJECT_ROOT" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/apk/*/*" \
              -print \
              | head -1)

          fi

          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: APK was not found."
            echo ""

            echo "All APK files:"
            find . \
              -type f \
              -name "*.apk" \
              -print || true

            echo ""
            echo "Build output directories:"
            find "$PROJECT_ROOT" \
              -type d \
              -path "*/build/outputs*" \
              -print || true

            exit 1

          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # =========================================
      # PREPARE APK
      # =========================================

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          SAFE_NAME=$(printf '%s' "${{ inputs.app_name }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]/-/g')

          OUTPUT_NAME="build-${SAFE_NAME}-${{ inputs.build_type }}.apk"

          cp "$APK_PATH" "$OUTPUT_NAME"

          test -s "$OUTPUT_NAME"

          echo "OUTPUT_APK=$OUTPUT_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "Final APK:"
          ls -lh "$OUTPUT_NAME"


      # =========================================
      # GITHUB RELEASE
      # =========================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "${{ inputs.app_name }} Build #${{ github.run_number }}"
          body: |
            ## APK Build

            **App:** ${{ inputs.app_name }}

            **Build type:** ${{ inputs.build_type }}

            **Project type:** ${{ env.PROJECT_TYPE }}

            **Build:** #${{ github.run_number }}

            APK generated automatically by GitHub Actions.
          files: ${{ env.OUTPUT_APK }}
          make_latest: false


      # =========================================
      # TELEGRAM
      # =========================================

      - name: Send APK to Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ inputs.user_id }}
        run: |
          set -e

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing."
            exit 1
          fi

          if [ -z "$TELEGRAM_USER_ID" ]; then
            echo "ERROR: Telegram user ID is missing."
            exit 1
          fi

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/build-${GITHUB_RUN_ID}"

          CAPTION="APK Build Selesai

          App: ${{ inputs.app_name }}
          Type: ${{ inputs.build_type }}
          Project: ${PROJECT_TYPE}
          Build: #${GITHUB_RUN_NUMBER}

          Download:
          ${RELEASE_URL}"

          echo "Sending APK to Telegram..."

          RESPONSE=$(curl \
            -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_USER_ID}" \
            -F "document=@${OUTPUT_APK}" \
            -F "caption=${CAPTION}")

          echo "$RESPONSE"

          if ! echo "$RESPONSE" | grep -q '"ok":true'; then
            echo ""
            echo "ERROR: Telegram API rejected the request."
            exit 1
          fi

          echo ""
          echo "Telegram upload successful."


      # =========================================
      # SUMMARY
      # =========================================

      - name: Build Summary
        shell: bash
        run: |
          echo ""
          echo "========================================="
          echo "              BUILD SUCCESS"
          echo "========================================="
          echo ""

          echo "App:"
          echo "${{ inputs.app_name }}"

          echo ""
          echo "Build type:"
          echo "${{ inputs.build_type }}"

          echo ""
          echo "Project type:"
          echo "${PROJECT_TYPE}"

          echo ""
          echo "APK:"
          echo "${OUTPUT_APK}"

          echo ""
          echo "Download:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/build-${GITHUB_RUN_ID}"

          echo ""
          echo "========================================="
