name: Build APK & Send to Telegram

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: true
        type: string

      user_id:
        description: "Telegram user ID"
        required: true
        type: string

      zip_url:
        description: "Project ZIP URL"
        required: true
        type: string

      build_type:
        description: "Build type"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found:"
            echo "$ANDROID_HOME"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          if [ -d "$ANDROID_HOME/cmdline-tools/16.0/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          fi

          echo "Android SDK:"
          echo "$ANDROID_HOME"


      # ============================================================
      # LICENSE
      # ============================================================

      - name: Accept Android licenses
        shell: bash
        run: |
          set +e

          yes | sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --licenses \
            >/dev/null 2>&1

          true

          set -e


      # ============================================================
      # DOWNLOAD ZIP
      # ============================================================

      - name: Download project
        shell: bash
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -e

          rm -rf project
          mkdir -p project

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 600 \
            "$ZIP_URL" \
            -o /tmp/project.zip

          unzip -t /tmp/project.zip

          unzip -q /tmp/project.zip -d project

          echo "Downloaded project:"
          find project -maxdepth 3 -type f | sort | head -300


      # ============================================================
      # NORMALIZE ZIP
      # ============================================================

      - name: Normalize project
        shell: bash
        run: |
          set -e

          cd project

          COUNT=$(find . -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$COUNT" = "1" ]; then
            FIRST=$(find . -mindepth 1 -maxdepth 1 -type d | head -1)

            if [ -n "$FIRST" ]; then
              shopt -s dotglob nullglob
              mv "$FIRST"/* .
              rmdir "$FIRST" || true
            fi
          fi

          echo "Project root:"
          ls -la


      # ============================================================
      # DETECT PROJECT
      # ============================================================

      - name: Detect project type
        working-directory: project
        shell: bash
        run: |
          set -e

          if [ -f "pubspec.yaml" ]; then
            echo "PROJECT_TYPE=flutter" >> "$GITHUB_ENV"
            echo "Detected Flutter project."

          elif [ -f "gradlew" ] || \
               [ -f "build.gradle" ] || \
               [ -f "build.gradle.kts" ] || \
               [ -d "app" ] || \
               [ -d "android/app" ]; then

            echo "PROJECT_TYPE=android" >> "$GITHUB_ENV"
            echo "Detected native Android project."

          else
            echo "ERROR: Unknown project type."
            find . -maxdepth 4 -type f | sort
            exit 1
          fi


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter
        if: env.PROJECT_TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: Flutter dependencies
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: project
        shell: bash
        run: |
          set -e

          flutter --version
          flutter clean
          flutter pub get


      # ============================================================
      # FIND ANDROID ROOT
      # ============================================================

      - name: Detect Android root
        if: env.PROJECT_TYPE == 'android'
        working-directory: project
        shell: bash
        run: |
          set -e

          if [ -d "android/app" ]; then
            echo "ANDROID_ROOT=android" >> "$GITHUB_ENV"
            echo "ANDROID_ROOT=android"

          elif [ -d "app" ]; then
            echo "ANDROID_ROOT=." >> "$GITHUB_ENV"
            echo "ANDROID_ROOT=."

          else
            echo "ERROR: Android app module not found."
            exit 1
          fi


      # ============================================================
      # ANDROID SDK PACKAGES
      # ============================================================

      - name: Install Android SDK packages
        if: env.PROJECT_TYPE == 'android'
        shell: bash
        run: |
          set -e

          COMPILE_SDK="35"

          if grep -RqsE \
            'compileSdk(Version)?[[:space:]]*[=:][[:space:]]*[0-9]+' \
            project/"$ANDROID_ROOT" \
            --include="*.gradle" \
            --include="*.gradle.kts"; then

            DETECTED=$(grep -RhoE \
              'compileSdk(Version)?[[:space:]]*[=:][[:space:]]*[0-9]+' \
              project/"$ANDROID_ROOT" \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              | grep -oE '[0-9]+' \
              | tail -1 || true)

            if [ -n "$DETECTED" ]; then
              COMPILE_SDK="$DETECTED"
            fi
          fi

          echo "Installing Android platform $COMPILE_SDK"

          sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-$COMPILE_SDK"

          sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            "build-tools;35.0.0"

          echo "Android SDK packages ready."


      # ============================================================
      # REPAIR GRADLE WRAPPER
      # ============================================================

      - name: Repair Gradle wrapper
        if: env.PROJECT_TYPE == 'android'
        working-directory: project
        shell: bash
        run: |
          set -e

          chmod +x gradlew 2>/dev/null || true

          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper is complete."

          else
            echo "Gradle wrapper JAR is missing."

            if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
              echo "ERROR: gradle-wrapper.properties is missing."
              exit 1
            fi

            URL=$(grep '^distributionUrl=' \
              gradle/wrapper/gradle-wrapper.properties \
              | cut -d= -f2-)

            if [ -z "$URL" ]; then
              echo "ERROR: distributionUrl not found."
              exit 1
            fi

            echo "Gradle URL:"
            echo "$URL"

            rm -rf /tmp/gradle-repair
            mkdir -p /tmp/gradle-repair

            curl \
              -L \
              --fail \
              --retry 5 \
              "$URL" \
              -o /tmp/gradle-repair/gradle.zip

            unzip -q \
              /tmp/gradle-repair/gradle.zip \
              -d /tmp/gradle-repair

            GRADLE_DIR=$(find /tmp/gradle-repair \
              -maxdepth 1 \
              -type d \
              -name 'gradle-*' \
              | head -1)

            if [ -z "$GRADLE_DIR" ]; then
              echo "ERROR: Gradle extraction failed."
              exit 1
            fi

            export PATH="$GRADLE_DIR/bin:$PATH"

            gradle --version

            gradle wrapper

            if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
              echo "ERROR: Failed to create Gradle wrapper."
              exit 1
            fi
          fi

          ./gradlew --version


      # ============================================================
      # REPAIR MISSING MIPMAP
      # ============================================================

      - name: Repair missing mipmap resources
        if: env.PROJECT_TYPE == 'android'
        working-directory: project
        shell: bash
        run: |
          set -e

          MANIFEST="$ANDROID_ROOT/app/src/main/AndroidManifest.xml"
          RES="$ANDROID_ROOT/app/src/main/res"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Manifest not found:"
            echo "$MANIFEST"
            exit 1
          fi

          mkdir -p "$RES"

          echo "Checking manifest resources..."

          python3 - "$MANIFEST" "$RES" <<'PY'
          import os
          import re
          import sys
          import shutil
          import struct
          import zlib

          manifest = sys.argv[1]
          res = sys.argv[2]

          with open(
              manifest,
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:
              content = f.read()

          names = sorted(set(
              re.findall(
                  r'@mipmap/([A-Za-z0-9_]+)',
                  content
              )
          ))

          print("Referenced mipmaps:")

          for name in names:
              print(" -", name)

          density_dirs = [
              "mipmap-mdpi",
              "mipmap-hdpi",
              "mipmap-xhdpi",
              "mipmap-xxhdpi",
              "mipmap-xxxhdpi",
          ]

          for directory in density_dirs:
              os.makedirs(
                  os.path.join(res, directory),
                  exist_ok=True
              )

          # Find an existing image.
          image = None

          for root, dirs, files in os.walk(res):
              for filename in files:
                  if filename.lower().endswith(
                      (".png", ".webp", ".jpg", ".jpeg")
                  ):
                      lower = filename.lower()

                      if (
                          "launcher" in lower
                          or "icon" in lower
                          or "logo" in lower
                      ):
                          image = os.path.join(root, filename)
                          break

              if image:
                  break

          if image is None:
              print("No existing icon found.")
              print("Creating fallback PNG.")

              width = 192
              height = 192

              raw = bytearray()

              for y in range(height):
                  raw.append(0)

                  for x in range(width):
                      if (
                          30 <= x < 162
                          and
                          30 <= y < 162
                      ):
                          pixel = (255, 255, 255, 255)
                      else:
                          pixel = (30, 80, 180, 255)

                      raw.extend(pixel)

              def chunk(name, data):
                  return (
                      struct.pack(">I", len(data))
                      + name
                      + data
                      + struct.pack(
                          ">I",
                          zlib.crc32(name + data)
                          & 0xffffffff
                      )
                  )

              png = b'\x89PNG\r\n\x1a\n'

              png += chunk(
                  b'IHDR',
                  struct.pack(
                      ">IIBBBBB",
                      width,
                      height,
                      8,
                      6,
                      0,
                      0,
                      0
                  )
              )

              png += chunk(
                  b'IDAT',
                  zlib.compress(bytes(raw), 9)
              )

              png += chunk(
                  b'IEND',
                  b''
              )

              image = "/tmp/fallback.png"

              with open(image, "wb") as f:
                  f.write(png)

          print("Fallback image:", image)

          for name in names:

              exists = False

              for root, dirs, files in os.walk(res):
                  for filename in files:
                      base = os.path.splitext(filename)[0]

                      if base.lower() == name.lower():
                          exists = True
                          break

                  if exists:
                      break

              if exists:
                  print("OK:", name)
                  continue

              print("MISSING:", name)

              for directory in density_dirs:
                  destination = os.path.join(
                      res,
                      directory,
                      name + ".png"
                  )

                  shutil.copyfile(
                      image,
                      destination
                  )

                  print("Created:", destination)
          PY


      # ============================================================
      # CLEAN MANIFEST
      # ============================================================

      - name: Fix AndroidManifest
        if: env.PROJECT_TYPE == 'android'
        working-directory: project
        shell: bash
        run: |
          set -e

          MANIFEST="$ANDROID_ROOT/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              content = f.read()

          content = re.sub(
              r'(\<manifest\b[^>]*?)\s+package\s*=\s*"[^"]*"',
              r'\1',
              content,
              count=1
          )

          with open(
              path,
              "w",
              encoding="utf-8"
          ) as f:
              f.write(content)

          print("Manifest fixed.")
          PY


      # ============================================================
      # BUILD FLUTTER
      # ============================================================

      - name: Build Flutter APK
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: project
        shell: bash
        run: |
          set -e

          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi


      # ============================================================
      # BUILD ANDROID
      # ============================================================

      - name: Build Android APK
        if: env.PROJECT_TYPE == 'android'
        working-directory: project
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace
          else
            ./gradlew assembleRelease \
              --no-daemon \
              --stacktrace
          fi


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Prepare APK
        working-directory: project
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -e

          APK=$(find . \
            -type f \
            -name "*.apk" \
            | grep -v "/intermediates/" \
            | head -1)

          if [ -z "$APK" ]; then
            APK=$(find . \
              -type f \
              -name "*.apk" \
              | head -1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/${APP_NAME}.apk"

          echo "APK_PATH=$GITHUB_WORKSPACE/output/${APP_NAME}.apk" \
            >> "$GITHUB_ENV"

          ls -lh "$GITHUB_WORKSPACE/output/${APP_NAME}.apk"


      # ============================================================
      # RELEASE
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "${{ inputs.app_name }} Build #${{ github.run_number }}"
          body: |
            APK build completed.

            App: ${{ inputs.app_name }}
            Build: ${{ inputs.build_type }}
            Run: #${{ github.run_number }}
          files: output/${{ inputs.app_name }}.apk


      # ============================================================
      # TELEGRAM
      # ============================================================

      - name: Send APK to Telegram
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.user_id }}
          APP_NAME: ${{ inputs.app_name }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -e

          if [ -z "$BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN secret is missing."
            exit 1
          fi

          curl \
            --fail \
            --retry 3 \
            -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=✅ Build berhasil

📱 ${APP_NAME}
🔧 ${BUILD_TYPE}
🔢 Run #${GITHUB_RUN_NUMBER}"

          echo "Telegram upload successful."


      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Summary
        if: always()
        run: |
          echo "========================================="
          echo "BUILD SUMMARY"
          echo "========================================="
          echo "App: ${{ inputs.app_name }}"
          echo "Type: ${{ inputs.build_type }}"
          echo "Project: ${PROJECT_TYPE:-unknown}"
          echo "========================================="
