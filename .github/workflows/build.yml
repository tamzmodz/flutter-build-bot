name: Build APK & Send to Telegram

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama aplikasi"
        required: true
        type: string

      user_id:
        description: "Telegram User ID"
        required: true
        type: string

      zip_url:
        description: "URL ZIP project"
        required: true
        type: string

      build_type:
        description: "Build type"
        required: true
        type: choice
        default: release
        options:
          - release
          - debug

  push:
    branches:
      - main


jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java 17
  uses: actions/setup-java@v5
  with:
    distribution: temurin
    java-version: "17"


      # ============================================================
      # ANDROID SDK
      # ============================================================

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "ANDROID SDK"
          echo "========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK tidak ditemukan."
            exit 1
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          echo "========================================="
          echo "ACCEPTING ANDROID LICENSES"
          echo "========================================="

          set +e
          yes | "$SDKMANAGER" --licenses
          LICENSE_EXIT=$?
          set -e

          echo "License command exit code: $LICENSE_EXIT"

          echo "========================================="
          echo "INSTALLING ANDROID PACKAGES"
          echo "========================================="

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "========================================="
          echo "ANDROID SDK READY"
          echo "========================================="


      # ============================================================
      # DOWNLOAD PROJECT ZIP
      # ============================================================

      - name: Download project ZIP
        shell: bash
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -e

          echo "========================================="
          echo "DOWNLOADING PROJECT"
          echo "========================================="

          if [ -z "$ZIP_URL" ]; then
            echo "ZIP URL kosong."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/project"

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 30 \
            --max-time 600 \
            "$ZIP_URL" \
            -o "$GITHUB_WORKSPACE/project.zip"

          FILE_SIZE=$(stat -c%s "$GITHUB_WORKSPACE/project.zip")

          echo "ZIP size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "ZIP terlalu kecil atau download gagal."
            exit 1
          fi

          echo "Testing ZIP..."

          unzip -t "$GITHUB_WORKSPACE/project.zip"

          echo "Extracting..."

          unzip -q "$GITHUB_WORKSPACE/project.zip" \
            -d "$GITHUB_WORKSPACE/project"

          echo "Project berhasil diekstrak."


      # ============================================================
      # FIND PROJECT ROOT
      # ============================================================

      - name: Detect project root
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "DETECTING PROJECT"
          echo "========================================="

          BASE="$GITHUB_WORKSPACE/project"

          echo "Files:"
          find "$BASE" -maxdepth 3 -type f | head -100 || true

          PROJECT_ROOT=""

          # Flutter
          PUBSPEC=$(find "$BASE" \
            -type f \
            -name "pubspec.yaml" \
            -print \
            -quit)

          if [ -n "$PUBSPEC" ]; then
            PROJECT_ROOT=$(dirname "$PUBSPEC")
            echo "Flutter project detected."
          fi

          # Native Android
          if [ -z "$PROJECT_ROOT" ]; then
            GRADLEW=$(find "$BASE" \
              -type f \
              -name "gradlew" \
              -print \
              -quit)

            if [ -n "$GRADLEW" ]; then
              PROJECT_ROOT=$(dirname "$GRADLEW")
              echo "Native Android Gradle project detected."
            fi
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo ""
            echo "========================================="
            echo "PROJECT TIDAK DITEMUKAN"
            echo "========================================="
            echo ""
            echo "Project harus memiliki salah satu:"
            echo "- pubspec.yaml"
            echo "- gradlew"
            echo ""
            exit 1
          fi

          echo ""
          echo "PROJECT_ROOT=$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          if [ -f "$PROJECT_ROOT/pubspec.yaml" ]; then
            echo "PROJECT_TYPE=flutter" >> "$GITHUB_ENV"
            echo "PROJECT_TYPE=flutter"
          else
            echo "PROJECT_TYPE=native" >> "$GITHUB_ENV"
            echo "PROJECT_TYPE=native"
          fi


      # ============================================================
      # FLUTTER SETUP
      # ============================================================

      - name: Setup Flutter
        if: env.PROJECT_TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ============================================================
      # FLUTTER DEPENDENCIES
      # ============================================================

      - name: Flutter dependencies
        if: env.PROJECT_TYPE == 'flutter'
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          echo "========================================="
          echo "FLUTTER"
          echo "========================================="

          flutter --version

          flutter config --no-analytics

          flutter pub get


      # ============================================================
      # FIND ANDROID ROOT
      # ============================================================

      - name: Detect Android directory
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "ANDROID DIRECTORY"
          echo "========================================="

          if [ -d "$PROJECT_ROOT/android/app" ]; then

            ANDROID_ROOT="$PROJECT_ROOT/android"

          elif [ -d "$PROJECT_ROOT/app" ]; then

            ANDROID_ROOT="$PROJECT_ROOT"

          else

            FOUND_APP=$(find "$PROJECT_ROOT" \
              -type d \
              -name app \
              -print \
              -quit)

            if [ -n "$FOUND_APP" ]; then
              ANDROID_ROOT=$(dirname "$FOUND_APP")
            fi

          fi

          if [ -z "$ANDROID_ROOT" ] || [ ! -d "$ANDROID_ROOT" ]; then
            echo "Android root tidak ditemukan."
            exit 1
          fi

          echo "ANDROID_ROOT=$ANDROID_ROOT"

          echo "ANDROID_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"


      # ============================================================
      # DETECT COMPILE SDK
      # ============================================================

      - name: Detect Android SDK version
        shell: bash
        run: |
          set -e

          ANDROID_ROOT="$ANDROID_ROOT"

          COMPILE_SDK="35"

          if [ -f "$ANDROID_ROOT/app/build.gradle" ]; then

            FOUND=$(grep -rhoE \
              'compileSdk(Value)?[[:space:]]*[=]?[[:space:]]*[0-9]+' \
              "$ANDROID_ROOT" \
              2>/dev/null \
              | grep -oE '[0-9]+' \
              | tail -1 || true)

            if [ -n "$FOUND" ]; then
              COMPILE_SDK="$FOUND"
            fi

          elif [ -f "$ANDROID_ROOT/app/build.gradle.kts" ]; then

            FOUND=$(grep -rhoE \
              'compileSdk[[:space:]]*\(?[[:space:]]*[0-9]+' \
              "$ANDROID_ROOT" \
              2>/dev/null \
              | grep -oE '[0-9]+' \
              | tail -1 || true)

            if [ -n "$FOUND" ]; then
              COMPILE_SDK="$FOUND"
            fi

          fi

          echo "Compile SDK detected: $COMPILE_SDK"

          echo "COMPILE_SDK=$COMPILE_SDK" >> "$GITHUB_ENV"


      # ============================================================
      # INSTALL DETECTED SDK
      # ============================================================

      - name: Install required Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1)
          fi

          echo "Installing platform android-$COMPILE_SDK"

          "$SDKMANAGER" \
            "platforms;android-$COMPILE_SDK"

          "$SDKMANAGER" \
            "build-tools;35.0.0"


      # ============================================================
      # REPAIR GRADLE WRAPPER
      # ============================================================

      - name: Repair Gradle Wrapper
        if: env.PROJECT_TYPE == 'native'
        shell: bash
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          set -e

          echo "========================================="
          echo "GRADLE WRAPPER"
          echo "========================================="

          chmod +x gradlew 2>/dev/null || true

          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then

            echo "Gradle wrapper JAR sudah ada."

          else

            echo "Gradle wrapper JAR tidak ditemukan."
            echo "Mencoba memperbaiki wrapper..."

            mkdir -p gradle/wrapper

            GRADLE_VERSION="8.7"

            if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

              DIST_URL=$(grep \
                '^distributionUrl=' \
                gradle/wrapper/gradle-wrapper.properties \
                | head -1 \
                | cut -d'=' -f2- \
                | sed 's/\\r//g' || true)

              if echo "$DIST_URL" | grep -qE 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?-bin.zip'; then

                GRADLE_VERSION=$(echo "$DIST_URL" \
                  | sed -nE 's/.*gradle-([0-9]+\.[0-9]+(\.[0-9]+)?)-bin\.zip.*/\1/p')

              fi

            fi

            echo "Using Gradle $GRADLE_VERSION"

            GRADLE_ZIP="/tmp/gradle-${GRADLE_VERSION}-bin.zip"
            GRADLE_DIR="/tmp/gradle-${GRADLE_VERSION}"

            curl \
              -L \
              --fail \
              --retry 5 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "$GRADLE_ZIP"

            rm -rf "$GRADLE_DIR"

            unzip -q "$GRADLE_ZIP" -d /tmp

            GRADLE_BIN="$GRADLE_DIR/bin/gradle"

            if [ ! -x "$GRADLE_BIN" ]; then
              echo "Gradle binary tidak ditemukan:"
              ls -la /tmp | head -50
              exit 1
            fi

            "$GRADLE_BIN" wrapper \
              --gradle-version "$GRADLE_VERSION" \
              --distribution-type bin

            chmod +x gradlew

          fi

          echo "Testing Gradle..."

          ./gradlew --version


      # ============================================================
      # REPAIR MISSING MIPMAP RESOURCES
      # ============================================================

      - name: Repair missing Android resources
        if: env.PROJECT_TYPE == 'native'
        shell: bash
        working-directory: ${{ env.ANDROID_ROOT }}
        run: |
          set -e

          echo "========================================="
          echo "REPAIRING MISSING MIPMAP RESOURCES"
          echo "========================================="

          RES="$ANDROID_ROOT/app/src/main/res"
          MANIFEST="$ANDROID_ROOT/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "AndroidManifest.xml tidak ditemukan."
            exit 0
          fi

          mkdir -p "$RES"

          # --------------------------------------------------------
          # Remove obsolete package attribute
          # --------------------------------------------------------

          python3 - "$MANIFEST" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          new_data = re.sub(
              r'\s+package\s*=\s*"[^"]*"',
              '',
              data,
              count=1
          )

          if new_data != data:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(new_data)

              print("Removed obsolete package attribute.")
          else:
              print("No package attribute changed.")
          PY

          # --------------------------------------------------------
          # Find mipmap references
          # --------------------------------------------------------

          python3 - "$MANIFEST" "$RES" <<'PY'
          import re
          import sys
          import os
          import shutil
          import struct
          import zlib

          manifest = sys.argv[1]
          res = sys.argv[2]

          with open(manifest, "r", encoding="utf-8") as f:
              data = f.read()

          names = sorted(set(
              re.findall(r'@mipmap/([A-Za-z0-9_]+)', data)
          ))

          print("Manifest mipmap references:")
          print(names)

          if not names:
              print("No mipmap references.")
              raise SystemExit(0)

          # --------------------------------------------------------
          # Find existing image
          # --------------------------------------------------------

          existing = None

          for root, dirs, files in os.walk(res):

              for filename in files:

                  lower = filename.lower()

                  if lower.endswith((
                      ".png",
                      ".jpg",
                      ".jpeg",
                      ".webp"
                  )):

                      existing = os.path.join(root, filename)
                      break

              if existing:
                  break

          print("Existing image:", existing)

          # --------------------------------------------------------
          # Generate simple fallback PNG
          # --------------------------------------------------------

          fallback = "/tmp/android_fallback_icon.png"

          def png_chunk(chunk_type, data):
              raw = chunk_type + data
              return (
                  struct.pack(">I", len(data))
                  + raw
                  + struct.pack(">I", zlib.crc32(raw) & 0xffffffff)
              )

          width = 192
          height = 192

          rows = []

          for y in range(height):

              row = bytearray([0])

              for x in range(width):

                  # simple dark background + white center
                  if (
                      x < 20 or
                      x >= width - 20 or
                      y < 20 or
                      y >= height - 20
                  ):
                      pixel = (25, 25, 25, 255)
                  else:
                      pixel = (80, 80, 80, 255)

                  row.extend(pixel)

              rows.append(bytes(row))

          raw_data = b"".join(rows)

          png = b"\x89PNG\r\n\x1a\n"

          png += png_chunk(
              b"IHDR",
              struct.pack(
                  ">IIBBBBB",
                  width,
                  height,
                  8,
                  6,
                  0,
                  0,
                  0
              )
          )

          png += png_chunk(
              b"IDAT",
              zlib.compress(raw_data, 9)
          )

          png += png_chunk(b"IEND", b"")

          with open(fallback, "wb") as f:
              f.write(png)

          # --------------------------------------------------------
          # Density directories
          # --------------------------------------------------------

          densities = [
              "mipmap-mdpi",
              "mipmap-hdpi",
              "mipmap-xhdpi",
              "mipmap-xxhdpi",
              "mipmap-xxxhdpi"
          ]

          for name in names:

              found = False

              for density in densities:

                  target_dir = os.path.join(res, density)
                  target = os.path.join(target_dir, name + ".png")

                  os.makedirs(target_dir, exist_ok=True)

                  # Check whether resource already exists
                  possible = [
                      os.path.join(target_dir, name + ".png"),
                      os.path.join(target_dir, name + ".webp"),
                      os.path.join(target_dir, name + ".jpg"),
                      os.path.join(target_dir, name + ".jpeg"),
                  ]

                  if any(os.path.exists(x) for x in possible):
                      found = True
                      break

              if found:
                  print("Resource already exists:", name)
                  continue

              print("Creating missing resource:", name)

              for density in densities:

                  target_dir = os.path.join(res, density)
                  os.makedirs(target_dir, exist_ok=True)

                  target = os.path.join(
                      target_dir,
                      name + ".png"
                  )

                  if existing:
                      shutil.copy2(existing, target)
                  else:
                      shutil.copy2(fallback, target)

          print("Mipmap repair finished.")
          PY

          echo "========================================="
          echo "RESOURCE REPAIR COMPLETE"
          echo "========================================="


      # ============================================================
      # FLUTTER BUILD
      # ============================================================

      - name: Build Flutter APK
        if: env.PROJECT_TYPE == 'flutter'
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          set -e

          echo "========================================="
          echo "FLUTTER APK BUILD"
          echo "========================================="

          flutter clean

          flutter pub get

          if [ "$BUILD_TYPE" = "debug" ]; then

            flutter build apk \
              --debug

          else

            flutter build apk \
              --release

          fi


      # ============================================================
      # NATIVE ANDROID BUILD
      # ============================================================

      - name: Build Native Android APK
        if: env.PROJECT_TYPE == 'native'
        shell: bash
        working-directory: ${{ env.ANDROID_ROOT }}
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          set -e

          echo "========================================="
          echo "NATIVE ANDROID APK BUILD"
          echo "========================================="

          chmod +x gradlew

          echo "Gradle:"
          ./gradlew --version

          echo "Build type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "debug" ]; then

            ./gradlew \
              --no-daemon \
              --stacktrace \
              --no-build-cache \
              assembleDebug

          else

            ./gradlew \
              --no-daemon \
              --stacktrace \
              --no-build-cache \
              assembleRelease

          fi


      # ============================================================
      # FIND APK
      # ============================================================

      - name: Find APK
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name || 'app' }}
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          set -e

          echo "========================================="
          echo "SEARCHING APK"
          echo "========================================="

          if [ "$BUILD_TYPE" = "debug" ]; then
            APK=$(find "$PROJECT_ROOT" \
              -type f \
              -path "*/build/outputs/apk/*" \
              -name "*debug*.apk" \
              | head -1 || true)
          else
            APK=$(find "$PROJECT_ROOT" \
              -type f \
              -path "*/build/outputs/apk/*" \
              -name "*release*.apk" \
              | head -1 || true)
          fi

          if [ -z "$APK" ]; then

            echo "APK berdasarkan build type tidak ditemukan."

            echo ""
            echo "Mencari semua APK..."

            find "$PROJECT_ROOT" \
              -type f \
              -name "*.apk" \
              -print || true

            APK=$(find "$PROJECT_ROOT" \
              -type f \
              -name "*.apk" \
              | head -1 || true)

          fi

          if [ -z "$APK" ]; then
            echo "APK TIDAK DITEMUKAN."
            exit 1
          fi

          echo ""
          echo "APK ditemukan:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          FINAL_APK="$GITHUB_WORKSPACE/output/${APP_NAME}.apk"

          cp "$APK" "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo ""
          echo "Final APK:"
          ls -lh "$FINAL_APK"


      # ============================================================
      # CREATE GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_NAME: ${{ inputs.app_name || 'app' }}
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          set -e

          echo "========================================="
          echo "GITHUB RELEASE"
          echo "========================================="

          VERSION="build-${GITHUB_RUN_NUMBER}"

          echo "Release: $VERSION"

          gh release create "$VERSION" \
            "$FINAL_APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$APP_NAME $VERSION" \
            --notes "Automatic APK build

          App: $APP_NAME
          Build type: $BUILD_TYPE
          Run: #$GITHUB_RUN_NUMBER
          Commit: $GITHUB_SHA"


      # ============================================================
      # SEND TO TELEGRAM
      # ============================================================

      - name: Send APK to Telegram
        if: success()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ inputs.user_id }}
          APP_NAME: ${{ inputs.app_name || 'app' }}
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          set -e

          echo "========================================="
          echo "TELEGRAM"
          echo "========================================="

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN belum diset."
            exit 1
          fi

          if [ -z "$TELEGRAM_USER_ID" ]; then
            echo "Telegram User ID kosong."
            exit 1
          fi

          CAPTION="✅ APK berhasil dibuat

          📱 App: $APP_NAME
          🔧 Type: $BUILD_TYPE
          🏗 Build: #$GITHUB_RUN_NUMBER
          📦 Repository: $GITHUB_REPOSITORY"

          RESPONSE=$(curl \
            -sS \
            --fail \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_USER_ID}" \
            -F "document=@${FINAL_APK}" \
            -F "caption=${CAPTION}")

          echo "$RESPONSE"


      # ============================================================
      # SUMMARY
      # ============================================================

      - name: Build Summary
        if: always()
        shell: bash
        env:
          APP_NAME: ${{ inputs.app_name || 'app' }}
          BUILD_TYPE: ${{ inputs.build_type || 'release' }}
        run: |
          echo ""
          echo "========================================="
          echo "BUILD SUMMARY"
          echo "========================================="
          echo "App        : $APP_NAME"
          echo "Build type : $BUILD_TYPE"
          echo "Project    : $PROJECT_TYPE"
          echo "Root       : $PROJECT_ROOT"
          echo "Android    : $ANDROID_ROOT"
          echo "SDK        : $COMPILE_SDK"
          echo "Run        : #$GITHUB_RUN_NUMBER"
          echo "========================================="
