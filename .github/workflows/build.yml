name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama APK / Release"
        required: true
        type: string
        default: "MyApp"

      zip_url:
        description: "Direct URL ZIP project Android Gradle"
        required: true
        type: string

      build_type:
        description: "Build type"
        required: true
        type: choice
        default: release
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # JAVA
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # DOWNLOAD PROJECT
      # =========================================================

      - name: Download Android project
        shell: bash
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -e

          rm -rf project
          mkdir -p project

          echo "Downloading project..."

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            "$ZIP_URL" \
            -o project.zip

          echo "ZIP downloaded:"
          ls -lh project.zip

          file project.zip

          unzip -q project.zip -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      # =========================================================
      # FIND GRADLE PROJECT
      # =========================================================

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          GRADLE_DIR=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then
              GRADLE_DIR="$DIR"
              break
            fi
          done < <(
            find project \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -type f
          )

          if [ -z "$GRADLE_DIR" ]; then
            echo "::error::Gradle project tidak ditemukan."
            echo "ZIP harus berisi project Android Gradle."
            exit 1
          fi

          GRADLE_DIR="$(realpath "$GRADLE_DIR")"

          echo "Gradle project:"
          echo "$GRADLE_DIR"

          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan."
            exit 1
          fi

          echo "Accepting Android SDK licenses..."

          "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Installing common Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-34" \
            "platforms;android-33" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" \
            "build-tools;33.0.2" \
            || true

          echo "Installed Android SDK:"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed || true

      # =========================================================
      # GRADLE WRAPPER / GRADLE BOOTSTRAP
      # =========================================================

      - name: Prepare Gradle
        shell: bash
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          set -e

          chmod +x gradlew 2>/dev/null || true

          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper JAR ditemukan."

            chmod +x gradlew

            ./gradlew --version

            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"

            exit 0
          fi

          echo "Gradle wrapper JAR tidak ditemukan."
          echo "Mencoba bootstrap Gradle..."

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::gradle-wrapper.properties juga tidak ditemukan."
            exit 1
          fi

          DISTRIBUTION_URL="$(
            grep '^distributionUrl=' \
              gradle/wrapper/gradle-wrapper.properties \
              | head -1 \
              | cut -d'=' -f2- \
              | sed 's/\\:/:/g'
          )"

          if [ -z "$DISTRIBUTION_URL" ]; then
            echo "::error::distributionUrl tidak ditemukan."
            exit 1
          fi

          echo "Gradle distribution:"
          echo "$DISTRIBUTION_URL"

          GRADLE_ZIP="/tmp/gradle.zip"
          GRADLE_HOME="/tmp/gradle"

          rm -rf "$GRADLE_HOME"
          mkdir -p "$GRADLE_HOME"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            "$DISTRIBUTION_URL" \
            -o "$GRADLE_ZIP"

          unzip -q "$GRADLE_ZIP" -d "$GRADLE_HOME"

          GRADLE_BIN="$(find "$GRADLE_HOME" -type f -path '*/bin/gradle' | head -1)"

          if [ -z "$GRADLE_BIN" ]; then
            echo "::error::Gradle binary tidak ditemukan."
            exit 1
          fi

          chmod +x "$GRADLE_BIN"

          "$GRADLE_BIN" --version

          echo "GRADLE_CMD=$GRADLE_BIN" >> "$GITHUB_ENV"

      # =========================================================
      # BUILD
      # =========================================================

      - name: Build APK
        shell: bash
        working-directory: ${{ env.GRADLE_DIR }}
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -e

          echo "Building type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "release" ]; then
            TASK="assembleRelease"
          else
            TASK="assembleDebug"
          fi

          echo "Gradle task: $TASK"

          "$GRADLE_CMD" \
            "$TASK" \
            --no-daemon \
            --stacktrace

      # =========================================================
      # FIND APK
      # =========================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching APK..."

          find "$GRADLE_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find "$GRADLE_DIR" \
            -type f \
            -name "*.apk" \
            | grep -E '/(release|debug)/' \
            | head -1)"

          if [ -z "$APK" ]; then
            APK="$(find "$GRADLE_DIR" \
              -type f \
              -name "*.apk" \
              | head -1)"
          fi

          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan setelah build."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" "$GITHUB_WORKSPACE/output/${{ inputs.app_name }}.apk"

          echo "APK_PATH=$GITHUB_WORKSPACE/output/${{ inputs.app_name }}.apk" >> "$GITHUB_ENV"

          ls -lh "$GITHUB_WORKSPACE/output/"

      # =========================================================
      # CREATE RELEASE
      # =========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "${{ inputs.app_name }} Build ${{ github.run_number }}"
          body: |
            ## ${{ inputs.app_name }}

            Automatic Android APK build.

            **Build type:** ${{ inputs.build_type }}

            **Run:** #${{ github.run_number }}

            Built automatically by GitHub Actions.
          files: |
            output/${{ inputs.app_name }}.apk
          draft: false
          prerelease: false
