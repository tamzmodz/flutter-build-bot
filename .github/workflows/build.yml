name: Build Flutter APK & Send to Telegram

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
      user_id:
        description: 'ID Telegram User'
        required: true
      zip_url:
        description: 'URL file ZIP'
        required: true
      build_type:
        description: 'Debug or Release'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Download & Extract Project ZIP
        run: |
          echo "Downloading ZIP..."
          curl -L "${{ github.event.inputs.zip_url }}" -o project.zip
          unzip -q project.zip -d my_project
          
          # Cari folder yang berisi file pubspec.yaml secara otomatis
          PROJECT_DIR=$(find my_project -name "pubspec.yaml" -exec dirname {} \;)
          cd "$PROJECT_DIR"
          
          echo "Current directory: $(pwd)"

          echo "Removing old pubspec.lock..."
          rm -f pubspec.lock

          echo "Fixing Font Awesome version in pubspec.yaml..."
          # Mengganti versi font_awesome_flutter secara langsung agar tidak menarik versi 10.12.0
          if grep -q "font_awesome_flutter" pubspec.yaml; then
            sed -i 's/font_awesome_flutter:.*/font_awesome_flutter: ^10.4.0/g' pubspec.yaml
          else
            echo "  font_awesome_flutter: ^10.4.0" >> pubspec.yaml
          fi

          # Menambahkan konfigurasi ndkVersion secara otomatis ke file Gradle
          GRADLE_FILE=$(find . -name "build.gradle*" | head -n 1)
          if [ -f "$GRADLE_FILE" ]; then
            echo "Adding ndkVersion to $GRADLE_FILE..."
            if grep -q "defaultConfig" "$GRADLE_FILE"; then
              sed -i '/defaultConfig {/a \        ndkVersion = "28.2.13676358"' "$GRADLE_FILE"
            elif grep -q "android {" "$GRADLE_FILE"; then
              sed -i '/android {/a \    ndkVersion = "28.2.13676358"' "$GRADLE_FILE"
            fi
          fi
          
          echo "Running flutter pub get..."
          flutter pub get

          echo "Building APK (${{ github.event.inputs.build_type }})..."
          if [ "${{ github.event.inputs.build_type }}" = "Release" ]; then
            flutter build apk --release --android-skip-build-dependency-validation
          else
            flutter build apk --debug --android-skip-build-dependency-validation
          fi

      - name: Send APK to Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: "8509039607:AAGybwHjNw4IeN5eoBywosJoDHwsYmHKWLg"
          CHAT_ID: ${{ github.event.inputs.user_id }}
          CAPTION: "✅ Build ${{ github.event.inputs.build_type }} Selesai!\n📁 Project: ${{ github.event.inputs.app_name }}"
        run: |
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          
          curl -F chat_id="$CHAT_ID" \
               -F document=@"$APK_FILE" \
               -F caption="$CAPTION" \
               "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"
