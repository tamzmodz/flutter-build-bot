name: Build APK & Send to Telegram

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama APK"
        required: true
        default: "MyApp"

      user_id:
        description: "Telegram User ID"
        required: true

      zip_url:
        description: "URL ZIP project"
        required: true

      build_type:
        description: "Tipe build"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # DOWNLOAD PROJECT
      # ==========================================

      - name: Download Project ZIP
        shell: bash
        run: |
          set -e

          echo "Downloading project..."

          rm -rf project downloaded.zip
          mkdir -p project

          curl -L --fail --retry 3 \
            "${{ inputs.zip_url }}" \
            -o downloaded.zip

          echo "ZIP downloaded:"
          ls -lh downloaded.zip

          unzip -q downloaded.zip -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +e

          yes | sdkmanager --licenses >/dev/null 2>&1

          echo "Android SDK licenses accepted."

      # ==========================================
      # DETECT PROJECT
      # ==========================================

      - name: Detect Project Type
        shell: bash
        run: |
          set -e

          echo "Searching for project..."

          FLUTTER_FILE=$(find project -type f -name "pubspec.yaml" -print -quit)
          GRADLE_FILE=$(find project -type f -name "gradlew" -print -quit)

          if [ -n "$FLUTTER_FILE" ]; then
            PROJECT_ROOT=$(dirname "$FLUTTER_FILE")
            PROJECT_TYPE="flutter"

          elif [ -n "$GRADLE_FILE" ]; then
            PROJECT_ROOT=$(dirname "$GRADLE_FILE")
            PROJECT_TYPE="gradle"

          else
            echo "ERROR: Could not detect Flutter or Android Gradle project."
            echo ""
            echo "Files found:"
            find project -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Project type: $PROJECT_TYPE"
          echo "Project root: $PROJECT_ROOT"

          echo "PROJECT_TYPE=$PROJECT_TYPE" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      # ==========================================
      # SHOW PROJECT
      # ==========================================

      - name: Show Project Structure
        shell: bash
        run: |
          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo ""
          echo "Project files:"
          find "$PROJECT_ROOT" -maxdepth 3 -type f | sort | head -200

      # ==========================================
      # SETUP FLUTTER
      # ==========================================

      - name: Setup Flutter
        if: env.PROJECT_TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ==========================================
      # FLUTTER BUILD
      # ==========================================

      - name: Build Flutter APK
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "Flutter version:"
          flutter --version

          echo ""
          echo "Running flutter clean..."
          flutter clean

          echo ""
          echo "Running flutter pub get..."
          flutter pub get

          echo ""
          echo "Building APK..."

          if [ "${{ inputs.build_type }}" = "release" ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi

      # ==========================================
      # DETECT ANDROID SDK REQUIREMENTS
      # ==========================================

      - name: Prepare Android SDK
        if: env.PROJECT_TYPE == 'gradle'
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "Checking Gradle configuration..."

          chmod +x gradlew

          echo ""
          echo "Gradle version:"
          ./gradlew --version

          echo ""
          echo "Checking Android SDK configuration..."

          if [ -f "app/build.gradle" ]; then
            grep -RniE \
              "compileSdk|compileSdkVersion|buildToolsVersion" \
              app/build.gradle \
              || true
          fi

          if [ -f "app/build.gradle.kts" ]; then
            grep -RniE \
              "compileSdk|buildToolsVersion" \
              app/build.gradle.kts \
              || true
          fi

      # ==========================================
      # GRADLE BUILD
      # ==========================================

      - name: Build Native Android APK
        if: env.PROJECT_TYPE == 'gradle'
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "Starting Gradle build..."

          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease
          else
            ./gradlew --no-daemon --stacktrace assembleDebug
          fi

      # ==========================================
      # LOCATE APK
      # ==========================================

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=""

          if [ "$PROJECT_TYPE" = "flutter" ]; then

            APK=$(find "$PROJECT_ROOT/build/app/outputs/flutter-apk" \
              -type f \
              -name "*.apk" \
              -print \
              | head -1)

          else

            APK=$(find "$PROJECT_ROOT" \
              -type f \
              -path "*/build/outputs/apk/*/*.apk" \
              -print \
              | head -1)

          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not found."

            echo ""
            echo "All APK files:"
            find . -type f -name "*.apk" -print || true

            echo ""
            echo "Build directories:"
            find "$PROJECT_ROOT" -type d -name "outputs" -print || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ==========================================
      # PREPARE APK
      # ==========================================

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          SAFE_NAME=$(echo "${{ inputs.app_name }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]/-/g')

          OUTPUT_NAME="build-${SAFE_NAME}-${{ inputs.build_type }}.apk"

          cp "$APK_PATH" "$OUTPUT_NAME"

          echo "OUTPUT_APK=$OUTPUT_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "Final APK:"
          ls -lh "$OUTPUT_NAME"

      # ==========================================
      # CREATE GITHUB RELEASE
      # ==========================================

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "${{ inputs.app_name }} Build #${{ github.run_number }}"
          body: |
            ## APK Build

            **App:** ${{ inputs.app_name }}

            **Build type:** ${{ inputs.build_type }}

            **Project type:** ${{ env.PROJECT_TYPE }}

            **Build number:** ${{ github.run_number }}

            **Commit:** ${{ github.sha }}

            APK generated automatically by GitHub Actions.
          files: ${{ env.OUTPUT_APK }}
          make_latest: false

      # ==========================================
      # SEND APK TO TELEGRAM
      # ==========================================

      - name: Send APK to Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ inputs.user_id }}
        run: |
          set -e

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN secret is not configured."
            exit 1
          fi

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/build-${GITHUB_RUN_NUMBER}"

          CAPTION="✅ APK Build Selesai

          📱 App: ${{ inputs.app_name }}
          🔧 Type: ${{ inputs.build_type }}
          🏗️ Project: ${PROJECT_TYPE}
          🔢 Build: #${GITHUB_RUN_NUMBER}

          🔗 Download:
          ${RELEASE_URL}"

          echo "Sending APK to Telegram..."

          curl -sS --fail \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_USER_ID}" \
            -F "document=@${OUTPUT_APK}" \
            -F "caption=${CAPTION}"

          echo ""
          echo "APK sent successfully."

      # ==========================================
      # SUMMARY
      # ==========================================

      - name: Build Summary
        shell: bash
        run: |
          echo "=========================================="
          echo "             BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "App:"
          echo "${{ inputs.app_name }}"
          echo ""
          echo "Type:"
          echo "${{ inputs.build_type }}"
          echo ""
          echo "Project:"
          echo "${PROJECT_TYPE}"
          echo ""
          echo "APK:"
          echo "${OUTPUT_APK}"
          echo ""
          echo "Release:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/build-${GITHUB_RUN_NUMBER}"
          echo ""
          echo "=========================================="
