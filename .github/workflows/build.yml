name: Build Flutter APK & Send to Telegram

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
      user_id:
        description: 'ID Telegram User'
        required: true
      zip_url:
        description: 'URL file ZIP'
        required: true
      build_type:
        description: 'Debug or Release'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

         - name: Setup Flutter SDK
     uses: subosito/flutter-action@v2
     with:
       flutter-version: '3.19.0'
       channel: 'stable'

      - name: Download & Extract Project ZIP
        run: |
          echo "Downloading ZIP..."
          curl -L "${{ github.event.inputs.zip_url }}" -o project.zip
          unzip -q project.zip -d my_project
          cd my_project
          
          # Masuk ke folder project (jika terbungkus di dalam folder zip)
          EXTRACTED_DIR=$(ls -d */ | head -n 1)
          if [ -d "$EXTRACTED_DIR" ]; then
            cd "$EXTRACTED_DIR"
          fi
          
          echo "Running flutter pub get..."
          flutter pub get

          echo "Building APK (${{ github.event.inputs.build_type }})..."
                    if [ "${{ github.event.inputs.build_type }}" = "Release" ]; then
            flutter build apk --release --android-skip-build-dependency-validation
          else
            flutter build apk --debug --android-skip-build-dependency-validation
          fi

      - name: Send APK to Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: "8509039607:AAGybwHjNw4IeN5eoBywosJoDHwsYmHKWLg"  # Ganti dengan Token Bot Telegram kamu
          CHAT_ID: ${{ github.event.inputs.user_id }}
          CAPTION: "✅ Build ${{ github.event.inputs.build_type }} Selesai!\n📁 Project: ${{ github.event.inputs.app_name }}"
        run: |
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          
          curl -F chat_id="$CHAT_ID" \
               -F document=@"$APK_FILE" \
               -F caption="$CAPTION" \
               "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument"
