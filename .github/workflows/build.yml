name: Build APK & Send to Telegram

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama APK"
        required: true
        default: "MyApp"

      user_id:
        description: "Telegram User ID"
        required: true

      zip_url:
        description: "URL ZIP project"
        required: true

      build_type:
        description: "Tipe build"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:

      # =========================================
      # CHECKOUT
      # =========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================
      # DOWNLOAD PROJECT
      # =========================================

      - name: Download Project ZIP
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Downloading project"
          echo "========================================="

          rm -rf project downloaded.zip
          mkdir -p project

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            "${{ inputs.zip_url }}" \
            -o downloaded.zip

          test -s downloaded.zip

          echo ""
          echo "Downloaded ZIP:"
          ls -lh downloaded.zip

          echo ""
          echo "Checking ZIP..."

          unzip -t downloaded.zip >/dev/null

          echo "ZIP is valid."

          echo ""
          echo "Extracting..."

          unzip -q downloaded.zip -d project

          echo ""
          echo "Project files:"
          find project -maxdepth 4 -type f | head -200


      # =========================================
      # JAVA
      # =========================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # =========================================
      # ANDROID SDK
      # =========================================

      - name: Setup Android SDK Environment
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Android SDK"
          echo "========================================="

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK not found."
            echo "Checked:"
            echo "$SDK"
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then

            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          elif [ -d "$SDK/cmdline-tools/16.0/bin" ]; then

            echo "$SDK/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"

          else

            echo "ERROR: Android command line tools not found."

            find "$SDK/cmdline-tools" \
              -maxdepth 3 \
              -type f \
              2>/dev/null \
              | head -100 || true

            exit 1

          fi


      # =========================================
      # ANDROID LICENSES
      # =========================================

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Android SDK licenses"
          echo "========================================="

          yes | sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --licenses \
            >/dev/null 2>&1 || true

          echo "Licenses processed."


      # =========================================
      # VERIFY SDK
      # =========================================

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Verify Android SDK"
          echo "========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "ADB:"
          adb version

          echo ""
          echo "SDK Manager:"
          sdkmanager --version

          echo ""
          echo "Installed packages:"
          sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            --list_installed \
            | head -150


      # =========================================
      # DETECT PROJECT
      # =========================================

      - name: Detect Project Type
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Detecting project"
          echo "========================================="

          FLUTTER_FILE=$(find project \
            -type f \
            -name "pubspec.yaml" \
            -print \
            -quit)

          GRADLE_FILE=$(find project \
            -type f \
            -name "gradlew" \
            -print \
            -quit)

          if [ -n "$FLUTTER_FILE" ]; then

            PROJECT_ROOT=$(dirname "$FLUTTER_FILE")
            PROJECT_TYPE="flutter"

            echo ""
            echo "Detected Flutter project."

          elif [ -n "$GRADLE_FILE" ]; then

            PROJECT_ROOT=$(dirname "$GRADLE_FILE")
            PROJECT_TYPE="gradle"

            echo ""
            echo "Detected Native Android Gradle project."

          else

            echo ""
            echo "ERROR: Could not detect project type."
            echo ""

            echo "Project structure:"
            find project \
              -maxdepth 7 \
              -type f \
              | sort \
              | head -500

            exit 1

          fi

          echo ""
          echo "PROJECT_TYPE=$PROJECT_TYPE"
          echo "PROJECT_ROOT=$PROJECT_ROOT"

          echo "PROJECT_TYPE=$PROJECT_TYPE" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"


      # =========================================
      # SHOW PROJECT
      # =========================================

      - name: Show Project Structure
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Project structure"
          echo "========================================="

          echo ""
          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo ""
          echo "Files:"

          find "$PROJECT_ROOT" \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -500


      # =========================================
      # DETECT ANDROID REQUIREMENTS
      #
      # Mencoba membaca compileSdk,
      # buildToolsVersion dan ndkVersion.
      # =========================================

      - name: Detect Android SDK Requirements
        if: env.PROJECT_TYPE == 'gradle'
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Detecting Android SDK requirements"
          echo "========================================="

          COMPILE_SDK=""
          BUILD_TOOLS=""
          NDK_VERSION=""

          SEARCH_FILES=$(find . \
            -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle.properties" \
            \) \
            -print)

          echo ""
          echo "Gradle configuration files:"
          echo "$SEARCH_FILES"

          for FILE in $SEARCH_FILES; do

            if [ -z "$COMPILE_SDK" ]; then
              COMPILE_SDK=$(grep -Eo \
                'compileSdk([[:space:]]*Version)?[[:space:]]*[=:]?[[:space:]]*[0-9]+' \
                "$FILE" 2>/dev/null \
                | grep -Eo '[0-9]+' \
                | head -1 || true)
            fi

            if [ -z "$BUILD_TOOLS" ]; then
              BUILD_TOOLS=$(grep -Eo \
                'buildToolsVersion[[:space:]]*[=:]?[[:space:]]*["'\''][0-9.]+["'\'']' \
                "$FILE" 2>/dev/null \
                | grep -Eo '[0-9]+\.[0-9]+(\.[0-9]+)?' \
                | head -1 || true)
            fi

            if [ -z "$NDK_VERSION" ]; then
              NDK_VERSION=$(grep -Eo \
                'ndkVersion[[:space:]]*[=:]?[[:space:]]*["'\''][^"'\'']+["'\'']' \
                "$FILE" 2>/dev/null \
                | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/' \
                | head -1 || true)
            fi

          done

          echo ""
          echo "Detected:"
          echo "COMPILE_SDK=$COMPILE_SDK"
          echo "BUILD_TOOLS=$BUILD_TOOLS"
          echo "NDK_VERSION=$NDK_VERSION"

          echo "COMPILE_SDK=$COMPILE_SDK" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"


      # =========================================
      # INSTALL REQUIRED ANDROID PACKAGES
      # =========================================

      - name: Install Required Android Packages
        if: env.PROJECT_TYPE == 'gradle'
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Installing required Android packages"
          echo "========================================="

          PACKAGES=""

          if [ -n "$COMPILE_SDK" ]; then
            PACKAGES="$PACKAGES platforms;android-$COMPILE_SDK"
          fi

          if [ -n "$BUILD_TOOLS" ]; then
            PACKAGES="$PACKAGES build-tools;$BUILD_TOOLS"
          fi

          if [ -n "$NDK_VERSION" ]; then
            PACKAGES="$PACKAGES ndk;$NDK_VERSION"
          fi

          if [ -z "$PACKAGES" ]; then
            echo "No explicit Android SDK requirements detected."
            echo "Using SDK packages already available on runner."
            exit 0
          fi

          echo ""
          echo "Packages:"
          echo "$PACKAGES"

          yes | sdkmanager \
            --sdk_root="$ANDROID_HOME" \
            $PACKAGES

          echo ""
          echo "Required Android packages installed."


      # =========================================
      # FLUTTER
      # =========================================

      - name: Setup Flutter
        if: env.PROJECT_TYPE == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # =========================================
      # FLUTTER BUILD
      # =========================================

      - name: Build Flutter APK
        if: env.PROJECT_TYPE == 'flutter'
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Flutter APK build"
          echo "========================================="

          echo ""
          echo "Flutter:"
          flutter --version

          echo ""
          echo "Cleaning..."
          flutter clean

          echo ""
          echo "Dependencies..."
          flutter pub get

          echo ""
          echo "Building APK..."

          if [ "${{ inputs.build_type }}" = "release" ]; then

            flutter build apk --release

          else

            flutter build apk --debug

          fi


      # =========================================
      # GRADLE WRAPPER REPAIR
      # =========================================

      - name: Prepare Native Android Project
        if: env.PROJECT_TYPE == 'gradle'
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Preparing Native Android project"
          echo "========================================="

          chmod +x gradlew

          WRAPPER_DIR="gradle/wrapper"
          WRAPPER_JAR="$WRAPPER_DIR/gradle-wrapper.jar"
          WRAPPER_PROPERTIES="$WRAPPER_DIR/gradle-wrapper.properties"

          echo ""
          echo "Checking Gradle Wrapper..."

          if [ -f "$WRAPPER_JAR" ]; then

            echo "Gradle Wrapper JAR found."

          else

            echo ""
            echo "Gradle Wrapper JAR is missing."
            echo "Repairing..."

            if [ ! -f "$WRAPPER_PROPERTIES" ]; then

              echo ""
              echo "ERROR: gradle-wrapper.properties is missing."

              echo ""
              echo "Gradle-related files:"
              find . \
                -type f \
                \( \
                  -name "gradle-wrapper.properties" \
                  -o -name "build.gradle" \
                  -o -name "build.gradle.kts" \
                  -o -name "settings.gradle" \
                  -o -name "settings.gradle.kts" \
                \) \
                -print \
                | sort

              exit 1

            fi

            echo ""
            echo "Wrapper properties:"
            cat "$WRAPPER_PROPERTIES"

            DISTRIBUTION_URL=$(grep '^distributionUrl=' \
              "$WRAPPER_PROPERTIES" \
              | sed 's/^distributionUrl=//' \
              | sed 's/\\:/:/g')

            if [ -z "$DISTRIBUTION_URL" ]; then

              echo ""
              echo "ERROR: distributionUrl not found."

              exit 1

            fi

            echo ""
            echo "Gradle distribution:"
            echo "$DISTRIBUTION_URL"

            echo ""
            echo "Downloading Gradle distribution..."

            rm -rf /tmp/gradle-repair

            mkdir -p /tmp/gradle-repair

            curl \
              -L \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              "$DISTRIBUTION_URL" \
              -o /tmp/gradle-repair/gradle.zip

            test -s /tmp/gradle-repair/gradle.zip

            echo ""
            echo "Testing Gradle archive..."

            unzip -t \
              /tmp/gradle-repair/gradle.zip \
              >/dev/null

            echo ""
            echo "Extracting Gradle..."

            mkdir -p /tmp/gradle-repair/extracted

            unzip -q \
              /tmp/gradle-repair/gradle.zip \
              -d /tmp/gradle-repair/extracted

            GRADLE_HOME=$(find /tmp/gradle-repair/extracted \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -name "gradle-*" \
              -print \
              | head -1)

            if [ -z "$GRADLE_HOME" ]; then

              echo ""
              echo "ERROR: Gradle directory was not found."

              find /tmp/gradle-repair/extracted \
                -maxdepth 2 \
                -type f \
                | head -100

              exit 1

            fi

            echo ""
            echo "Gradle home:"
            echo "$GRADLE_HOME"

            export PATH="$GRADLE_HOME/bin:$PATH"

            echo ""
            echo "Gradle version:"
            gradle --version

            echo ""
            echo "Generating Gradle Wrapper..."

            gradle wrapper

            if [ ! -f "$WRAPPER_JAR" ]; then

              echo ""
              echo "ERROR: Gradle Wrapper JAR was not generated."

              echo ""
              echo "Wrapper directory:"
              find "$WRAPPER_DIR" \
                -maxdepth 2 \
                -type f \
                -print \
                || true

              exit 1

            fi

            echo ""
            echo "Gradle Wrapper successfully repaired."

          fi

          echo ""
          echo "Wrapper files:"
          find "$WRAPPER_DIR" \
            -maxdepth 2 \
            -type f \
            -print

          echo ""
          echo "Testing wrapper..."

          ./gradlew --version


      # =========================================
      # NATIVE GRADLE BUILD
      # =========================================

      - name: Build Native Android APK
        if: env.PROJECT_TYPE == 'gradle'
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Native Android APK build"
          echo "========================================="

          chmod +x gradlew

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar is missing."
            exit 1
          fi

          echo ""
          echo "Gradle:"
          ./gradlew --version

          echo ""

          if [ "${{ inputs.build_type }}" = "release" ]; then

            echo "Building RELEASE..."

            ./gradlew \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              assembleRelease

          else

            echo "Building DEBUG..."

            ./gradlew \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              assembleDebug

          fi


      # =========================================
      # LOCATE APK
      # =========================================

      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Searching APK"
          echo "========================================="

          APK=""

          if [ "$PROJECT_TYPE" = "flutter" ]; then

            APK=$(find "$PROJECT_ROOT" \
              -type f \
              -name "*.apk" \
              -path "*/build/app/outputs/flutter-apk/*" \
              -print \
              | head -1)

          else

            APK=$(find "$PROJECT_ROOT" \
              -type f \
              -name "*.apk" \
              -path "*/build/outputs/apk/*/*" \
              -print \
              | head -1)

          fi

          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: APK was not found."

            echo ""
            echo "All APK files:"
            find . \
              -type f \
              -name "*.apk" \
              -print \
              || true

            echo ""
            echo "Build output directories:"
            find "$PROJECT_ROOT" \
              -type d \
              -path "*/build/outputs*" \
              -print \
              || true

            exit 1

          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # =========================================
      # PREPARE APK
      # =========================================

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          SAFE_NAME=$(printf '%s' "${{ inputs.app_name }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]/-/g')

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="app"
          fi

          OUTPUT_NAME="build-${SAFE_NAME}-${{ inputs.build_type }}.apk"

          cp "$APK_PATH" "$OUTPUT_NAME"

          test -s "$OUTPUT_NAME"

          echo "OUTPUT_APK=$OUTPUT_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "Final APK:"
          ls -lh "$OUTPUT_NAME"


      # =========================================
      # GITHUB RELEASE
      # =========================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "${{ inputs.app_name }} Build #${{ github.run_number }}"
          body: |
            ## APK Build

            **App:** ${{ inputs.app_name }}

            **Build type:** ${{ inputs.build_type }}

            **Project type:** ${{ env.PROJECT_TYPE }}

            **Build:** #${{ github.run_number }}

            APK generated automatically by GitHub Actions.
          files: ${{ env.OUTPUT_APK }}
          make_latest: false


      # =========================================
      # TELEGRAM
      # =========================================

      - name: Send APK to Telegram
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ inputs.user_id }}
        run: |
          set -e

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing."
            exit 1
          fi

          if [ -z "$TELEGRAM_USER_ID" ]; then
            echo "ERROR: Telegram user ID is missing."
            exit 1
          fi

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/build-${GITHUB_RUN_ID}"

          CAPTION="APK Build Selesai

          App: ${{ inputs.app_name }}
          Type: ${{ inputs.build_type }}
          Project: ${PROJECT_TYPE}
          Build: #${GITHUB_RUN_NUMBER}

          Download:
          ${RELEASE_URL}"

          echo "Sending APK to Telegram..."

          RESPONSE=$(curl \
            -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_USER_ID}" \
            -F "document=@${OUTPUT_APK}" \
            -F "caption=${CAPTION}")

          echo "$RESPONSE"

          if ! echo "$RESPONSE" | grep -q '"ok":true'; then
            echo ""
            echo "ERROR: Telegram API rejected the request."
            exit 1
          fi

          echo ""
          echo "Telegram upload successful."


      # =========================================
      # SUMMARY
      # =========================================

      - name: Build Summary
        shell: bash
        run: |
          echo ""
          echo "========================================="
          echo "             BUILD SUCCESS"
          echo "========================================="

          echo ""
          echo "App:"
          echo "${{ inputs.app_name }}"

          echo ""
          echo "Build type:"
          echo "${{ inputs.build_type }}"

          echo ""
          echo "Project type:"
          echo "${PROJECT_TYPE}"

          echo ""
          echo "APK:"
          echo "${OUTPUT_APK}"

          echo ""
          echo "Download:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/build-${GITHUB_RUN_ID}"

          echo ""
          echo "========================================="
