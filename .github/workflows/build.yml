name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama APK / Release"
        required: true
        type: string
        default: "MyApp"

      zip_url:
        description: "Direct URL ZIP project Android Gradle"
        required: true
        type: string

      build_type:
        description: "Build type"
        required: true
        type: choice
        default: release
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # DOWNLOAD ZIP
      # =========================================================

      - name: Download Android Project
        shell: bash
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -e

          rm -rf project
          rm -f project.zip

          mkdir -p project

          echo "======================================"
          echo "Downloading Android project..."
          echo "======================================"

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 900 \
            "$ZIP_URL" \
            -o project.zip

          echo ""
          echo "Downloaded ZIP:"
          ls -lh project.zip

          echo ""
          echo "File type:"
          file project.zip

          echo ""
          echo "Extracting..."

          unzip -q project.zip -d project

          echo ""
          echo "Project files:"
          find project -maxdepth 4 -type f | head -150


      # =========================================================
      # FIND GRADLE PROJECT
      # =========================================================

      - name: Locate Gradle Project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle project..."

          GRADLE_DIR=""

          while IFS= read -r FILE; do

            DIR="$(dirname "$FILE")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              GRADLE_DIR="$DIR"
              break

            fi

          done < <(
            find project \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -type f
          )

          if [ -z "$GRADLE_DIR" ]; then
            echo ""
            echo "::error::Gradle project tidak ditemukan."
            echo ""
            echo "ZIP harus memiliki settings.gradle"
            echo "atau settings.gradle.kts"
            echo ""
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          GRADLE_DIR="$(realpath "$GRADLE_DIR")"

          echo ""
          echo "======================================"
          echo "Gradle project:"
          echo "$GRADLE_DIR"
          echo "======================================"

          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "Accepting Android SDK licenses..."

          "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-34" \
            "platforms;android-33" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" \
            "build-tools;33.0.2" \
            || true

          echo ""
          echo "Android SDK preparation complete."


      # =========================================================
      # GRADLE WRAPPER
      # =========================================================

      - name: Prepare Gradle
        shell: bash
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          set -e

          echo "Checking Gradle..."

          chmod +x gradlew 2>/dev/null || true

          # -----------------------------------------------------
          # Normal wrapper
          # -----------------------------------------------------

          if [ -f "gradle/wrapper/gradle-wrapper.jar" ] && \
             [ -f "gradle/wrapper/gradle-wrapper.properties" ] && \
             [ -f "gradlew" ]; then

            echo "Gradle wrapper lengkap ditemukan."

            chmod +x gradlew

            ./gradlew --version

            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"

            exit 0
          fi

          # -----------------------------------------------------
          # Wrapper JAR missing
          # -----------------------------------------------------

          echo ""
          echo "Gradle wrapper tidak lengkap."
          echo "Mencoba bootstrap Gradle..."

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::gradle-wrapper.properties tidak ditemukan."
            exit 1
          fi

          DISTRIBUTION_URL="$(
            grep '^distributionUrl=' \
              gradle/wrapper/gradle-wrapper.properties \
              | head -1 \
              | cut -d'=' -f2- \
              | sed 's/\\:/:/g'
          )"

          if [ -z "$DISTRIBUTION_URL" ]; then
            echo "::error::distributionUrl tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "Gradle distribution:"
          echo "$DISTRIBUTION_URL"

          GRADLE_ZIP="/tmp/gradle.zip"
          GRADLE_HOME="/tmp/gradle"

          rm -rf "$GRADLE_HOME"
          mkdir -p "$GRADLE_HOME"

          echo ""
          echo "Downloading Gradle..."

          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 600 \
            "$DISTRIBUTION_URL" \
            -o "$GRADLE_ZIP"

          echo ""
          echo "Extracting Gradle..."

          unzip -q "$GRADLE_ZIP" -d "$GRADLE_HOME"

          GRADLE_BIN="$(
            find "$GRADLE_HOME" \
              -type f \
              -path "*/bin/gradle" \
              | head -1
          )"

          if [ -z "$GRADLE_BIN" ]; then
            echo "::error::Gradle binary tidak ditemukan."
            exit 1
          fi

          chmod +x "$GRADLE_BIN"

          echo ""
          "$GRADLE_BIN" --version

          echo "GRADLE_CMD=$GRADLE_BIN" >> "$GITHUB_ENV"


      # =========================================================
      # REPAIR MISSING MIPMAP RESOURCES
      # =========================================================

      - name: Repair Missing Mipmap Resources
        shell: bash
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "Checking Android resources..."
          echo "======================================"

          MANIFEST="app/src/main/AndroidManifest.xml"
          RES_DIR="app/src/main/res"

          if [ ! -f "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml tidak ditemukan."
            exit 1
          fi

          mkdir -p "$RES_DIR"

          # -----------------------------------------------------
          # Generate valid fallback PNG
          # -----------------------------------------------------

          FALLBACK_DIR="/tmp/android-fallback"

          rm -rf "$FALLBACK_DIR"
          mkdir -p "$FALLBACK_DIR"

          python3 - <<'PY'
          import base64
          from pathlib import Path

          # Valid 1x1 PNG
          png = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk"
              "YAAAAAYAAjCB0C8AAAAASUVORK5CYII="
          )

          Path("/tmp/android-fallback/fallback.png").write_bytes(png)
          PY

          # -----------------------------------------------------
          # Find all @mipmap references
          # -----------------------------------------------------

          grep -oE '@mipmap/[A-Za-z0-9_]+' "$MANIFEST" \
            | sed 's#@mipmap/##' \
            | sort -u \
            > /tmp/mipmap_names.txt || true

          echo ""
          echo "Mipmap references:"

          cat /tmp/mipmap_names.txt || true

          # -----------------------------------------------------
          # Repair every missing mipmap
          # -----------------------------------------------------

          while IFS= read -r NAME; do

            [ -z "$NAME" ] && continue

            echo ""
            echo "Checking: $NAME"

            FOUND=""

            while IFS= read -r FILE; do

              if [ -f "$FILE" ]; then
                FOUND="$FILE"
                break
              fi

            done < <(
              find "$RES_DIR" \
                -type f \
                \( \
                  -name "${NAME}.png" \
                  -o \
                  -name "${NAME}.webp" \
                  -o \
                  -name "${NAME}.xml" \
                \)
            )

            if [ -n "$FOUND" ]; then

              echo "OK:"
              echo "$FOUND"

              continue

            fi

            echo "MISSING: $NAME"
            echo "Creating fallback..."

            for DIR in \
              mipmap-mdpi \
              mipmap-hdpi \
              mipmap-xhdpi \
              mipmap-xxhdpi \
              mipmap-xxxhdpi
            do

              mkdir -p "$RES_DIR/$DIR"

              cp \
                "$FALLBACK_DIR/fallback.png" \
                "$RES_DIR/$DIR/$NAME.png"

            done

          done < /tmp/mipmap_names.txt

          echo ""
          echo "======================================"
          echo "Final mipmap resources:"
          echo "======================================"

          find "$RES_DIR" \
            -type f \
            -path "*/mipmap-*/*" \
            -print \
            | sort


      # =========================================================
      # REMOVE OLD MANIFEST PACKAGE ATTRIBUTE
      # =========================================================

      - name: Clean Android Manifest
        shell: bash
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          set -e

          MANIFEST="app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            exit 0
          fi

          echo "Checking manifest package attribute..."

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/src/main/AndroidManifest.xml")

          text = path.read_text(encoding="utf-8")

          # Remove package="..." from <manifest ...>
          text = re.sub(
              r'(<manifest\b[^>]*?)\s+package\s*=\s*"[^"]*"',
              r'\1',
              text,
              count=1
          )

          path.write_text(text, encoding="utf-8")

          print("Manifest cleaned.")
          PY


      # =========================================================
      # SHOW PROJECT INFO
      # =========================================================

      - name: Show Android Project
        shell: bash
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          echo "======================================"
          echo "Project directory"
          echo "======================================"

          pwd

          echo ""
          echo "Files:"

          find . -maxdepth 3 -type f \
            | sort \
            | head -200


      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build APK
        shell: bash
        working-directory: ${{ env.GRADLE_DIR }}
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -e

          echo "======================================"
          echo "BUILD APK"
          echo "======================================"

          echo "Build type:"
          echo "$BUILD_TYPE"

          if [ "$BUILD_TYPE" = "release" ]; then
            TASK="assembleRelease"
          else
            TASK="assembleDebug"
          fi

          echo ""
          echo "Gradle task:"
          echo "$TASK"

          echo ""
          echo "Starting Gradle..."

          "$GRADLE_CMD" \
            "$TASK" \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Gradle build finished."


      # =========================================================
      # FIND APK
      # =========================================================

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING APK"
          echo "======================================"

          echo ""
          echo "All APK files:"

          find "$GRADLE_DIR" \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          APK=""

          if [ "${{ inputs.build_type }}" = "release" ]; then

            APK="$(
              find "$GRADLE_DIR" \
                -type f \
                -path "*/build/outputs/apk/release/*.apk" \
                | head -1
            )"

          else

            APK="$(
              find "$GRADLE_DIR" \
                -type f \
                -path "*/build/outputs/apk/debug/*.apk" \
                | head -1
            )"

          fi

          # Fallback
          if [ -z "$APK" ]; then

            APK="$(
              find "$GRADLE_DIR" \
                -type f \
                -name "*.apk" \
                | head -1
            )"

          fi

          if [ -z "$APK" ]; then
            echo ""
            echo "::error::APK tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/output/${{ inputs.app_name }}.apk"

          echo ""
          echo "Final APK:"

          ls -lh \
            "$GITHUB_WORKSPACE/output/${{ inputs.app_name }}.apk"

          echo "APK_PATH=$GITHUB_WORKSPACE/output/${{ inputs.app_name }}.apk" >> "$GITHUB_ENV"


      # =========================================================
      # CREATE GITHUB RELEASE
      # =========================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "${{ inputs.app_name }} Build ${{ github.run_number }}"
          body: |
            # ${{ inputs.app_name }}

            Automatic Android APK build.

            **Build type:** ${{ inputs.build_type }}

            **Build number:** ${{ github.run_number }}

            **Commit:** ${{ github.sha }}

            Built automatically by GitHub Actions.
          files: |
            output/${{ inputs.app_name }}.apk
          draft: false
          prerelease: false
