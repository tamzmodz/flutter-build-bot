name: Build APK & Send to Telegramy

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama Aplikasi"
        required: true
        type: string

      user_id:
        description: "ID Telegram User"
        required: true
        type: string

      zip_url:
        description: "URL file ZIP project"
        required: true
        type: string

      build_type:
        description: "Debug or Release"
        required: true
        default: "Release"
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # DOWNLOAD PROJECT ZIP
      # ==========================================

      - name: Download Project ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOADING PROJECT"
          echo "=========================================="

          rm -rf project.zip extracted_project project

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --silent \
            --show-error \
            "$ZIP_URL" \
            --output project.zip

          if [ ! -s project.zip ]; then
            echo "ERROR: ZIP kosong atau gagal didownload."
            exit 1
          fi

          echo "ZIP downloaded successfully."

          mkdir -p extracted_project

          unzip -q project.zip -d extracted_project

          echo "ZIP extracted successfully."

          echo ""
          echo "Searching project files..."

          find extracted_project -maxdepth 5 \
            \( -name "pubspec.yaml" -o -name "gradlew" \) \
            -print

          # ==========================================
          # FIND PROJECT ROOT
          # ==========================================

          FLUTTER_FILE=$(find extracted_project \
            -type f \
            -name "pubspec.yaml" \
            -print -quit)

          GRADLE_FILE=$(find extracted_project \
            -type f \
            -name "gradlew" \
            -print -quit)

          if [ -n "$FLUTTER_FILE" ]; then

            PROJECT_DIR=$(dirname "$FLUTTER_FILE")
            BUILD_SYSTEM="flutter"

          elif [ -n "$GRADLE_FILE" ]; then

            PROJECT_DIR=$(dirname "$GRADLE_FILE")
            BUILD_SYSTEM="gradle"

          else

            echo ""
            echo "ERROR: Project tidak dikenali."
            echo ""
            echo "Project harus memiliki salah satu:"
            echo "  - pubspec.yaml"
            echo "  - gradlew"
            echo ""

            exit 1

          fi

          # Convert relative path
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo ""
          echo "=========================================="
          echo "PROJECT DETECTED"
          echo "=========================================="

          echo "Build system : $BUILD_SYSTEM"
          echo "Project dir  : $PROJECT_DIR"

          # Copy project ke lokasi sederhana
          rm -rf project
          cp -a "$PROJECT_DIR" project

          echo ""
          echo "Project copied to:"
          pwd
          ls -la project

          # Save build system for next steps
          echo "$BUILD_SYSTEM" > build-system.txt


      # ==========================================
      # SETUP JAVA
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================
      # SETUP ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # SETUP FLUTTER
      # ==========================================

      - name: Setup Flutter
        if: hashFiles('project/pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # ==========================================
      # BUILD FLUTTER
      # ==========================================

      - name: Build Flutter APK
        if: hashFiles('project/pubspec.yaml') != ''
        working-directory: project
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FLUTTER PROJECT"
          echo "=========================================="

          flutter --version

          echo ""
          echo "Cleaning project..."

          flutter clean

          echo ""
          echo "Getting dependencies..."

          flutter pub get

          echo ""
          echo "Building APK..."

          if [ "$BUILD_TYPE" = "Release" ]; then

            flutter build apk \
              --release \
              --android-skip-build-dependency-validation

          else

            flutter build apk \
              --debug \
              --android-skip-build-dependency-validation

          fi

          echo ""
          echo "Flutter build finished."

          find build \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # BUILD NATIVE GRADLE
      # ==========================================

      - name: Build Native Android APK
        if: hashFiles('project/pubspec.yaml') == '' && hashFiles('project/gradlew') != ''
        working-directory: project
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "NATIVE ANDROID / GRADLE PROJECT"
          echo "=========================================="

          chmod +x gradlew

          echo ""
          echo "Gradle version:"

          ./gradlew --version

          echo ""
          echo "Building APK..."

          if [ "$BUILD_TYPE" = "Release" ]; then

            ./gradlew \
              --no-daemon \
              --stacktrace \
              assembleRelease

          else

            ./gradlew \
              --no-daemon \
              --stacktrace \
              assembleDebug

          fi

          echo ""
          echo "Gradle build finished."

          echo ""
          echo "APK files:"

          find . \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # FIND APK
      # ==========================================

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          APK_FILE=$(find project \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: APK tidak ditemukan."
            echo ""
            echo "Isi project:"
            find project -maxdepth 6 -type f | head -n 200
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          APK_ABSOLUTE=$(realpath "$APK_FILE")

          echo "absolute=$APK_ABSOLUTE" >> "$GITHUB_OUTPUT"

          echo ""
          echo "APK size:"

          ls -lh "$APK_ABSOLUTE"


      # ==========================================
      # RENAME APK
      # ==========================================

      - name: Prepare APK
        id: prepare
        env:
          APP_NAME: ${{ inputs.app_name }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          APK="${{ steps.apk.outputs.absolute }}"

          SAFE_NAME=$(echo "$APP_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]/-/g' \
            | sed 's/--*/-/g' \
            | sed 's/^-//' \
            | sed 's/-$//')

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="app"
          fi

          OUTPUT="build-${SAFE_NAME}-${BUILD_TYPE,,}.apk"

          cp "$APK" "$OUTPUT"

          echo "output=$OUTPUT" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Prepared APK:"
          ls -lh "$OUTPUT"


      # ==========================================
      # CREATE UNIQUE RELEASE
      # ==========================================

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "${{ inputs.app_name }} - Build ${{ github.run_number }}"
          body: |
            ## APK Build

            **Application:** ${{ inputs.app_name }}

            **Build type:** ${{ inputs.build_type }}

            **Build number:** ${{ github.run_number }}

            APK berhasil dibuat oleh GitHub Actions.
          files: ${{ steps.prepare.outputs.output }}


      # ==========================================
      # SEND APK TO TELEGRAM
      # ==========================================

      - name: Send APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ inputs.user_id }}
          APP_NAME: ${{ inputs.app_name }}
          BUILD_TYPE: ${{ inputs.build_type }}
          APK_FILE: ${{ steps.prepare.outputs.output }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SENDING APK TO TELEGRAM"
          echo "=========================================="

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN belum diset."
            exit 1
          fi

          if [ -z "${CHAT_ID:-}" ]; then
            echo "ERROR: Telegram User ID kosong."
            exit 1
          fi

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK tidak ditemukan:"
            echo "$APK_FILE"
            exit 1
          fi

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/build-${GITHUB_RUN_NUMBER}"

          CAPTION="✅ APK Build Selesai

          📱 App: ${APP_NAME}
          🔧 Build: ${BUILD_TYPE}
          🔢 Build: #${GITHUB_RUN_NUMBER}

          🔗 Download:
          ${RELEASE_URL}"

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --form "chat_id=${CHAT_ID}" \
            --form "document=@${APK_FILE}" \
            --form "caption=${CAPTION}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument")

          echo "$RESPONSE"

          echo ""
          echo "=========================================="
          echo "APK BERHASIL DIKIRIM"
          echo "=========================================="

          echo "Release:"
          echo "$RELEASE_URL"
